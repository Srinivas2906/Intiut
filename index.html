02Fspan>\n          <span class=\"rule\"><\u002Fspan>\n          <span>Impact<\u002Fspan>\n        <\u002Fdiv>\n        <h1 class=\"s0b-title\">Two projects that shaped how I think<\u002Fh1>\n        <p class=\"s0b-subtitle\">Customer obsession at enterprise scale and at startup speed.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- TWO COLUMNS -->\n      <div class=\"s0b-cols\">\n\n        <!-- LEFT — CRUISE -->\n        <div class=\"s0b-col\">\n          <span class=\"s0b-tag s0b-tag--enterprise\">Enterprise Scale<\u002Fspan>\n          <h2 class=\"s0b-project-title\">Customer Support Consolidation<\u002Fh2>\n          <div class=\"s0b-role\">Cruise · Lead Engineer · 2022–2025<\u002Fdiv>\n\n          <div class=\"s0b-block\">\n            <div class=\"label\">The Customer Problem<\u002Fdiv>\n            <p class=\"body\">Customer support fragmented across in-house tools. Long SLAs. No unified experience across phone, chat, email, web.<\u002Fp>\n          <\u002Fdiv>\n\n          <div class=\"s0b-block\">\n            <div class=\"label\">The Architectural Decision<\u002Fdiv>\n            <p class=\"body\">Consolidate onto Salesforce Service Cloud. Build omni-channel routing on AWS Connect + Service Cloud Voice. In-app and web chat using Messaging. Web-to-case and email-to-case. Customer-facing portal hosting safety standards, knowledge, intake forms.<\u002Fp>\n            <div class=\"s0b-icon-row\">\n              <span class=\"s0b-chip\">\n                <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n                  <path d=\"M22 16.92v3a2 2 0 0 1-2.18 2A19.79 19.79 0 0 1 2.08 4.18 2 2 0 0 1 4.06 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z\"><\u002Fpath>\n                <\u002Fsvg>Voice / IVR\n              <\u002Fspan>\n              <span class=\"s0b-chip\">\n                <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n                  <path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"><\u002Fpath>\n                <\u002Fsvg>In-App Chat\n              <\u002Fspan>\n              <span class=\"s0b-chip\">\n                <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n                  <rect x=\"2\" y=\"4\" width=\"20\" height=\"16\" rx=\"2\"><\u002Frect><path d=\"m22 6-10 7L2 6\"><\u002Fpath>\n                <\u002Fsvg>Email-to-Case\n              <\u002Fspan>\n              <span class=\"s0b-chip\">\n                <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n                  <rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"><\u002Frect><path d=\"M3 9h18\"><\u002Fpath><path d=\"M9 21V9\"><\u002Fpath>\n                <\u002Fsvg>Self-Service Portal\n              <\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"s0b-block\">\n            <div class=\"label\">The Outcome<\u002Fdiv>\n            <p class=\"body\">Chat SLA reduced from 10 minutes to 30 seconds. Threaded conversation with inbox view. Survey fatigue reduced. Foundation that scaled across digital channels.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"s0b-divider\" aria-hidden=\"true\"><\u002Fdiv>\n\n        <!-- RIGHT — INFLUENCER MARKETPLACE -->\n        <div class=\"s0b-col\">\n          <span class=\"s0b-tag s0b-tag--startup\">Startup Speed<\u002Fspan>\n          <h2 class=\"s0b-project-title\">Influencer Marketplace MVP<\u002Fh2>\n          <div class=\"s0b-role\">Founder · Side venture · 2023–2024<\u002Fdiv>\n\n          <div class=\"s0b-block\">\n            <div class=\"label\">The Customer Problem<\u002Fdiv>\n            <p class=\"body\">Brands struggle to find and engage the right influencers. Influencers struggle to monetize and grow. Discovery, vetting, and transaction all happen across disconnected channels.<\u002Fp>\n          <\u002Fdiv>\n\n          <div class=\"s0b-block\">\n            <div class=\"label\">The Architectural Decision<\u002Fdiv>\n            <p class=\"body\">Two-sided marketplace with shopping-cart purchase flow for influencer services. Built the full product — onboarding, customer journey maps, monetization model. CRM with agent console, Stream Chat for messaging, Exotel for IVR. AI features — promotional script generation, fake follower detection, niche finder.<\u002Fp>\n            <div class=\"s0b-icon-row\">\n              <span class=\"s0b-chip\">\n                <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n                  <path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"><\u002Fpath>\n                <\u002Fsvg>Stream Chat\n              <\u002Fspan>\n              <span class=\"s0b-chip\">\n                <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n                  <path d=\"M22 16.92v3a2 2 0 0 1-2.18 2A19.79 19.79 0 0 1 2.08 4.18 2 2 0 0 1 4.06 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z\"><\u002Fpath>\n                <\u002Fsvg>Exotel IVR\n              <\u002Fspan>\n              <span class=\"s0b-chip\">\n                <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n                  <circle cx=\"9\" cy=\"21\" r=\"1\"><\u002Fcircle><circle cx=\"20\" cy=\"21\" r=\"1\"><\u002Fcircle><path d=\"M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6\"><\u002Fpath>\n                <\u002Fsvg>Cart Checkout\n              <\u002Fspan>\n              <span class=\"s0b-chip\">\n                <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n                  <path d=\"M12 2v4\"><\u002Fpath><path d=\"M12 18v4\"><\u002Fpath><path d=\"m4.93 4.93 2.83 2.83\"><\u002Fpath><path d=\"m16.24 16.24 2.83 2.83\"><\u002Fpath><path d=\"M2 12h4\"><\u002Fpath><path d=\"M18 12h4\"><\u002Fpath><path d=\"m4.93 19.07 2.83-2.83\"><\u002Fpath><path d=\"m16.24 7.76 2.83-2.83\"><\u002Fpath>\n                <\u002Fsvg>AI Features\n              <\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"s0b-block\">\n            <div class=\"label\">The Outcome<\u002Fdiv>\n            <p class=\"body\">End-to-end MVP shipped. Validated the two-sided marketplace model. Designed every layer from product strategy to data model to AI features. Founder accountability — every decision was mine.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <!-- BOTTOM CALLOUT -->\n      <div class=\"s0b-callout\">\n        <span class=\"s0b-callout-label\">THE&nbsp;THROUGH-LINE<\u002Fspan>\n        <span class=\"s0b-callout-body\">Engineering depth. Product ownership. Customer obsession. <em>Different scales<\u002Fem> — <em>same instincts<\u002Fem>.<\u002Fspan>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n  <\u002Fsection>\n\n  <section data-label=\"01 Title\" class=\"s1\">\n\n    <!-- Intuit-inspired brand bar -->\n    <div class=\"s1-bar\" aria-hidden=\"true\"><\u002Fdiv>\n\n    <!-- Decorative architectural mark: two intersecting circles = AI ∩ Human -->\n    <div class=\"s1-mark\" aria-hidden=\"true\">\n      <svg viewBox=\"0 0 320 320\" fill=\"none\">\n        <circle cx=\"120\" cy=\"160\" r=\"110\" stroke=\"rgba(10,37,64,0.30)\" stroke-width=\"1.25\"><\u002Fcircle>\n        <circle cx=\"200\" cy=\"160\" r=\"110\" stroke=\"#0077C5\" stroke-width=\"1.25\" stroke-opacity=\"0.85\"><\u002Fcircle>\n        <circle cx=\"120\" cy=\"160\" r=\"110\" stroke=\"rgba(10,37,64,0.12)\" stroke-width=\"1\" stroke-dasharray=\"2 6\"><\u002Fcircle>\n        <line x1=\"0\" y1=\"160\" x2=\"320\" y2=\"160\" stroke=\"rgba(10,37,64,0.14)\" stroke-width=\"1\"><\u002Fline>\n        <line x1=\"160\" y1=\"0\" x2=\"160\" y2=\"320\" stroke=\"rgba(10,37,64,0.14)\" stroke-width=\"1\"><\u002Fline>\n        <circle cx=\"160\" cy=\"160\" r=\"4\" fill=\"#FFB200\"><\u002Fcircle>\n      <\u002Fsvg>\n    <\u002Fdiv>\n\n    <div class=\"s1-frame\">\n\n      <!-- TOP BAR -->\n      <div class=\"s1-topbar\">\n        <div><span class=\"dot\"><\u002Fspan>Case Study Presentation<\u002Fdiv>\n        <div class=\"right\">\n          <div><span>Engagement<\u002Fspan><strong>GBSG<\u002Fstrong><\u002Fdiv>\n          <div><span>Duration<\u002Fspan><strong>25 min<\u002Fstrong><\u002Fdiv>\n          <div><span>Slide<\u002Fspan><strong>01 / —<\u002Fstrong><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- HERO -->\n      <div class=\"s1-hero\">\n\n        <div class=\"s1-eyebrow\">\n          <span class=\"num\">001<\u002Fspan>\n          <span class=\"rule\"><\u002Fspan>\n          <span>\n<\u002Fspan>\n        <\u002Fdiv>\n\n        <h1 class=\"s1-title\">\n          GBSG Case Management<br>\n          <span class=\"accent\">Transformation<\u002Fspan>\n        <\u002Fh1>\n\n        <p class=\"s1-subtitle\">\n          A target-state architecture for AI <span class=\"pipe\">+<\u002Fspan> human intelligence,\n          anchored by single-threaded ownership.\n        <\u002Fp>\n\n      <\u002Fdiv>\n\n      <!-- META -->\n      <div class=\"s1-meta\">\n\n        <div>\n          <div class=\"label\">Presented by<\u002Fdiv>\n          <div class=\"value\">\n            Shiva Prasad Achukatla\n            <span class=\"sub\">Staff Expert — Network Solutions Architect<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div class=\"label\">Audience<\u002Fdiv>\n          <div class=\"value\">\n            Intuit\n            <span class=\"sub\">Customer Success Solutions<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div class=\"label\">Format<\u002Fdiv>\n          <div class=\"value\">\n            Case Study\n            <span class=\"sub\">25-minute presentation + Q&amp;A<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"date-block\">\n          <div class=\"label\">Date<\u002Fdiv>\n          <div class=\"value\">May 4, 2026<\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n  <\u002Fsection>\n\n  <section data-label=\"02 From → To\" class=\"s2j\">\n\n    <div class=\"s2j-bar\" aria-hidden=\"true\"><\u002Fdiv>\n\n    <div class=\"s2j-frame\">\n\n      <div class=\"s2j-eyebrow\">\n        <span class=\"num\">002<\u002Fspan>\n        <span class=\"rule\"><\u002Fspan>\n        <span>The Transformation<\u002Fspan>\n      <\u002Fdiv>\n\n      <h1 class=\"s2j-title\">\n        From fragmented support to <span class=\"accent\">single-threaded ownership<\u002Fspan>\n      <\u002Fh1>\n\n      <p class=\"s2j-subtitle\">Same customer. Same payroll issue. Two different experiences.<\u002Fp>\n\n      <!-- TWO PARALLEL JOURNEYS -->\n      <div class=\"s2j-grid\">\n\n        <!-- LEFT — FRAGMENTED -->\n        <div class=\"s2j-col s2j-col--from\">\n          <div class=\"s2j-colhead\">\n            <div class=\"s2j-tag s2j-tag--from\">Fragmented Support — Today<\u002Fdiv>\n            <div class=\"s2j-colsub\">The customer carries the burden.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"s2j-track\">\n            <div class=\"s2j-rail\" aria-hidden=\"true\"><\u002Fdiv>\n\n            <div class=\"s2j-step\">\n              <div class=\"s2j-num\">01<\u002Fdiv>\n              <div class=\"s2j-icon\" aria-hidden=\"true\">\n                <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"6\" width=\"18\" height=\"13\" rx=\"1.5\"><\u002Frect><path d=\"M3.5 7l8.5 6.5L20.5 7\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <div class=\"s2j-body\">\n                <div class=\"s2j-when\">Monday · Customer emails<\u002Fdiv>\n                <div class=\"s2j-text\">Payroll did not run. Sends an email to support.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"s2j-step\">\n              <div class=\"s2j-num\">02<\u002Fdiv>\n              <div class=\"s2j-icon\" aria-hidden=\"true\">\n                <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"13\" r=\"8\"><\u002Fcircle><path d=\"M12 9v4l2.5 2\"><\u002Fpath><path d=\"M9 3h6\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <div class=\"s2j-body\">\n                <div class=\"s2j-when\">No timely response<\u002Fdiv>\n                <div class=\"s2j-text\">Email sits in queue. Customer hears nothing back.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"s2j-step\">\n              <div class=\"s2j-num\">03<\u002Fdiv>\n              <div class=\"s2j-icon\" aria-hidden=\"true\">\n                <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5.5 4.5c0 8 6 14 14 14l1.5-3.5-4-2-2 2c-2.5-1-4.5-3-5.5-5.5l2-2-2-4z\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <div class=\"s2j-body\">\n                <div class=\"s2j-when\">Wednesday · Customer calls<\u002Fdiv>\n                <div class=\"s2j-text\">Picks up the phone. Different agent. Different system.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"s2j-step\">\n              <div class=\"s2j-num\">04<\u002Fdiv>\n              <div class=\"s2j-icon\" aria-hidden=\"true\">\n                <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 5h13a3 3 0 013 3v5a3 3 0 01-3 3H10l-4 3.5V16H7a3 3 0 01-3-3V5z\"><\u002Fpath><path d=\"M14 8.5a3 3 0 10-2.7 4.4\"><\u002Fpath><path d=\"M14 7v2h-2\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <div class=\"s2j-body\">\n                <div class=\"s2j-when\">Re-explains from scratch<\u002Fdiv>\n                <div class=\"s2j-text\">Agent has no visibility into Monday's email. Customer carries the context.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"s2j-step\">\n              <div class=\"s2j-num\">05<\u002Fdiv>\n              <div class=\"s2j-icon\" aria-hidden=\"true\">\n                <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2.5\" y=\"6\" width=\"8\" height=\"10\" rx=\"1\"><\u002Frect><rect x=\"13.5\" y=\"8\" width=\"8\" height=\"10\" rx=\"1\"><\u002Frect><path d=\"M10.5 11h3\" stroke-dasharray=\"1.5 1.5\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <div class=\"s2j-body\">\n                <div class=\"s2j-when\">Two separate cases<\u002Fdiv>\n                <div class=\"s2j-text\">One issue. Two cases. The customer is the only thing connecting them.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"s2j-callout s2j-callout--from\">\n            <div class=\"s2j-callout-label\">What's broken<\u002Fdiv>\n            <ul>\n              <li><strong>Reactive<\u002Fstrong> — Intuit only knows after she reports<\u002Fli>\n              <li><strong>Fragmented<\u002Fstrong> — channels don't share state<\u002Fli>\n              <li><strong>Customer-driven<\u002Fstrong> — she follows up, she carries context<\u002Fli>\n              <li><strong>Context-leaking<\u002Fstrong> — every handoff loses what came before<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- DIVIDER -->\n        <div class=\"s2j-divider\" aria-hidden=\"true\"><\u002Fdiv>\n\n        <!-- RIGHT — TARGET STATE -->\n        <div class=\"s2j-col s2j-col--to\">\n          <div class=\"s2j-colhead\">\n            <div class=\"s2j-tag s2j-tag--to\"><span class=\"dot\"><\u002Fspan>Single-Threaded Ownership — Target State<\u002Fdiv>\n            <div class=\"s2j-colsub\">Intuit carries the burden.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"s2j-track\">\n            <div class=\"s2j-rail s2j-rail--to\" aria-hidden=\"true\"><\u002Fdiv>\n\n            <div class=\"s2j-step\">\n              <div class=\"s2j-num\">01<\u002Fdiv>\n              <div class=\"s2j-icon\" aria-hidden=\"true\">\n                <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"5.5\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"1.5\" fill=\"currentColor\"><\u002Fcircle><path d=\"M12 3v3M12 18v3M3 12h3M18 12h3\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <div class=\"s2j-body\">\n                <div class=\"s2j-when\">Intuit's product agent detects first<\u002Fdiv>\n                <div class=\"s2j-text\">Payroll AI agent notices the anomaly. Customer has not yet contacted support.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"s2j-step\">\n              <div class=\"s2j-num\">02<\u002Fdiv>\n              <div class=\"s2j-icon\" aria-hidden=\"true\">\n                <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 16V11a6 6 0 0112 0v5l1.5 2H4.5L6 16z\"><\u002Fpath><path d=\"M10 19a2 2 0 004 0\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <div class=\"s2j-body\">\n                <div class=\"s2j-when\">Proactive outreach<\u002Fdiv>\n                <div class=\"s2j-text\">Intuit Assist flags it to the customer in-product. Conversation begins immediately.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"s2j-step\">\n              <div class=\"s2j-num\">03<\u002Fdiv>\n              <div class=\"s2j-icon\" aria-hidden=\"true\">\n                <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7.5a1.5 1.5 0 011.5-1.5h4l2 2.5h9A1.5 1.5 0 0121 10v8.5a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 18.5v-11z\"><\u002Fpath><path d=\"M8 13h8M8 16h5\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <div class=\"s2j-body\">\n                <div class=\"s2j-when\">Case opened · context bundled<\u002Fdiv>\n                <div class=\"s2j-text\">Single case in case management. Anomaly detection, conversation, customer history all attached.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"s2j-step\">\n              <div class=\"s2j-num\">04<\u002Fdiv>\n              <div class=\"s2j-icon\" aria-hidden=\"true\">\n                <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5.5 4.5c0 8 6 14 14 14l1.5-3.5-4-2-2 2c-2.5-1-4.5-3-5.5-5.5l2-2-2-4z\"><\u002Fpath><path d=\"M16 4.5l1.5 1.5L20.5 3\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <div class=\"s2j-body\">\n                <div class=\"s2j-when\">Customer calls — expert sees everything<\u002Fdiv>\n                <div class=\"s2j-text\">Anomaly detection. Intuit Assist conversation. Full case context. No re-explaining.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"s2j-step\">\n              <div class=\"s2j-num\">05<\u002Fdiv>\n              <div class=\"s2j-icon\" aria-hidden=\"true\">\n                <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"7\" width=\"18\" height=\"10\" rx=\"1.5\"><\u002Frect><path d=\"M7 12h10\" stroke-width=\"2\"><\u002Fpath><circle cx=\"7\" cy=\"12\" r=\"1.5\" fill=\"currentColor\" stroke=\"none\"><\u002Fcircle><circle cx=\"17\" cy=\"12\" r=\"1.5\" fill=\"currentColor\" stroke=\"none\"><\u002Fcircle><\u002Fsvg>\n              <\u002Fdiv>\n              <div class=\"s2j-body\">\n                <div class=\"s2j-when\">Resolved · proactive updates throughout<\u002Fdiv>\n                <div class=\"s2j-text\">Customer receives proactive updates. AI assists the expert. Customer talks to one person.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"s2j-callout s2j-callout--to\">\n            <div class=\"s2j-callout-label\">What the bridge delivers<\u002Fdiv>\n            <ul>\n              <li><strong>Proactive<\u002Fstrong> — Intuit knows first<\u002Fli>\n              <li><strong>Unified<\u002Fstrong> — every channel, one case<\u002Fli>\n              <li><strong>Intuit-driven<\u002Fstrong> — single-threaded ownership<\u002Fli>\n              <li><strong>Context-traveling<\u002Fstrong> — context lives with the case<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <div class=\"s2j-footer\">\n        <div class=\"label\">The Opportunity<\u002Fdiv>\n        <div class=\"body\">\n          Bridge Intuit's <em>existing AI agents<\u002Fem> (product agents · Intuit Assist · VEP) to a <em>unified case management system<\u002Fem>. The customer never re-explains. Intuit owns the follow-up. Context travels with the case end-to-end.\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n  <\u002Fsection>\n\n  <section data-label=\"03 Discovery\" class=\"s3\">\n\n    <div class=\"s3-bar\" aria-hidden=\"true\"><\u002Fdiv>\n\n    <div class=\"s3-frame\">\n\n      <div class=\"s3-eyebrow\">\n        <span class=\"num\">003<\u002Fspan>\n        <span class=\"rule\"><\u002Fspan>\n        <span>Discovery<\u002Fspan>\n      <\u002Fdiv>\n\n      <h1 class=\"s3-title\">Discovery &amp; assumptions<\u002Fh1>\n      <p class=\"s3-subtitle\">What I would validate first — and what I assumed to proceed.<\u002Fp>\n\n      <div class=\"s3-note\">\n        <div class=\"item\"><span class=\"dot\">·<\u002Fspan><span>In a real engagement, discovery is grounded in data — case volumes, repeat contact rates, SLA breach reasons, identity coverage gaps.<\u002Fspan><\u002Fdiv>\n        <div class=\"item\"><span class=\"dot\">·<\u002Fspan><span>Without GBSG data, assumptions based on patterns at enterprise scale.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"s3-table\">\n\n        <div class=\"head cat\">Category<\u002Fdiv>\n        <div class=\"head\">Discovery question<\u002Fdiv>\n        <div class=\"head\">My assumption<\u002Fdiv>\n\n        <div class=\"s3-row first-of-cat last-of-cat\">\n          <div class=\"cell cat\">System<br>Dependencies<\u002Fdiv>\n          <div class=\"cell q\">What systems hold customer and case data today?<\u002Fdiv>\n          <div class=\"cell a\">Multiple disconnected systems · CRMs split by sub-segment · Identity does not stitch across products · Breaks entitlement, SLA, routing · <em class=\"accent\">The foundational dependency<\u002Fem><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"s3-row first-of-cat last-of-cat\">\n          <div class=\"cell cat\">Case<br>Continuity<\u002Fdiv>\n          <div class=\"cell q\">How does context travel across channels today?<\u002Fdiv>\n          <div class=\"cell a\">Cases get duplicated · <strong>Context does not travel with the case<\u002Fstrong> · Customers re-explain · Summaries buried in unstructured notes<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"s3-row first-of-cat last-of-cat\">\n          <div class=\"cell cat\">Multi-team<br>Coordination<\u002Fdiv>\n          <div class=\"cell q\">How do multi-expert cases coordinate today?<\u002Fdiv>\n          <div class=\"cell a\">Routed via internal tickets · No consolidated view · <strong>No summarization for the owner<\u002Fstrong> · Customer follows up<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"s3-row first-of-cat last-of-cat\">\n          <div class=\"cell cat\">Proactive<br>Communication<\u002Fdiv>\n          <div class=\"cell q\">How does the system notify customers today?<\u002Fdiv>\n          <div class=\"cell a\"><strong>No proactive engine<\u002Fstrong> · Updates pulled, not pushed · Customer tracks status · No state-change notifications<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"s3-row first-of-cat last-of-cat\">\n          <div class=\"cell cat\">AI<br>Resolution<\u002Fdiv>\n          <div class=\"cell q\">What AI resolves cases today?<\u002Fdiv>\n          <div class=\"cell a\">Product agents detect anomalies · Intuit Assist converses · No AI agent proposes or executes resolutions or build context · Every case requires full human work<\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <div class=\"s3-footer\">\n        <div class=\"label\">Architecture vs. Timing<\u002Fdiv>\n        <div class=\"body\">\n          The roadmap is shaped by these assumptions. If discovery reveals different facts — <strong>the architecture stays. The timing flexes.<\u002Fstrong>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n  <\u002Fsection>\n\n  <section data-label=\"04 Target State Architecture\" class=\"s4r\">\n\n    <div class=\"s4r-bar\" aria-hidden=\"true\"><\u002Fdiv>\n\n    <div class=\"s4r-frame\">\n\n      <!-- HEADER -->\n      <div class=\"s4r-head\">\n        <div class=\"s4r-eyebrow\">\n          <span class=\"s4r-num\">004<\u002Fspan>\n          <span class=\"s4r-divider\"><\u002Fspan>\n          <span class=\"s4r-section\">TARGET STATE ARCHITECTURE<\u002Fspan>\n        <\u002Fdiv>\n        <h2 class=\"s4r-title\">Twelve layers, <span class=\"s4r-accent\">one case lifecycle<\u002Fspan><\u002Fh2>\n        <p class=\"s4r-subtitle\">Most layers exist today — what's new is the case-management bridge. Every layer interacts with at least three others. All layers operate on the same data model.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- BODY: GenSRF top + main+L11 column + AI Learning bottom -->\n      <div class=\"s4r-body\">\n\n        <!-- L6 GenSRF banner -->\n        <div class=\"s4r-banner s4r-banner--top\">\n          <div class=\"s4r-banner-l\">\n            <div class=\"s4r-id s4r-id--banner\">L6<\u002Fdiv>\n            <div class=\"s4r-banner-name\">\n              <div class=\"s4r-name-text\">GenSRF<\u002Fdiv>\n              <div class=\"s4r-sub\">Spans every layer · cannot be bypassed<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s4r-banner-tags\">\n            <span class=\"s4r-chip\">Agent action verification<\u002Fspan>\n            <span class=\"s4r-chip\">Real-time fraud detection<\u002Fspan>\n            <span class=\"s4r-chip\">AI guardrails on high-stakes actions<\u002Fspan>\n            <span class=\"s4r-chip\">Full audit trail<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"s4r-banner-why\">GenSRF secures what AI does. CRM platform secures what humans see.<\u002Fdiv>\n          <div class=\"s4r-flag\"><span class=\"s4r-tag s4r-tag--ex\">EXISTING<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Middle: 9 stacked rows + L11 column -->\n        <div class=\"s4r-mid\">\n          <div class=\"s4r-stack\">\n            \n        <div class=\"s4r-row\">\n          <div class=\"s4r-l\">\n            <div class=\"s4r-id\">L1<\u002Fdiv>\n            <div class=\"s4r-name\">\n              <div class=\"s4r-name-text\">Customer<\u002Fdiv>\n              <div class=\"s4r-sub\">Trigger + final validator<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s4r-tags\">\n            <span class=\"s4r-chip\">Product agents + Products<\u002Fspan><span class=\"s4r-chip\">Cases<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"s4r-why\">Only the customer can move case to Resolved. Expert close → Pending Customer Confirmation only.<\u002Fdiv>\n          <div class=\"s4r-flag\"><span class=\"s4r-tag s4r-tag--ex\">EXISTING<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"s4r-row\">\n          <div class=\"s4r-l\">\n            <div class=\"s4r-id\">L2<\u002Fdiv>\n            <div class=\"s4r-name\">\n              <div class=\"s4r-name-text\">Channels<\u002Fdiv>\n              <div class=\"s4r-sub\">All paid tiers · phone &amp; chat<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s4r-tags\">\n            <span class=\"s4r-chip\">Intuit Assist<\u002Fspan><span class=\"s4r-chip\">Embedded chatbot<\u002Fspan><span class=\"s4r-chip\">External chatbot<\u002Fspan><span class=\"s4r-chip\">AI Voice Agent<\u002Fspan><span class=\"s4r-chip\">Email-to-case<\u002Fspan><span class=\"s4r-chip\">Web-to-case<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"s4r-why\">All paid tiers get every channel. Differentiation = hours, SLA &amp; routing model — not channel access.<\u002Fdiv>\n          <div class=\"s4r-flag\"><span class=\"s4r-tag s4r-tag--ex\">EXISTING<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"s4r-row\">\n          <div class=\"s4r-l\">\n            <div class=\"s4r-id\">L3<\u002Fdiv>\n            <div class=\"s4r-name\">\n              <div class=\"s4r-name-text\">Normalization<\u002Fdiv>\n              <div class=\"s4r-sub\">Pre-routing layer — the brain<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s4r-tags\">\n            <span class=\"s4r-chip\">Identity (unified ID)<\u002Fspan><span class=\"s4r-chip\">Entitlement snap<\u002Fspan><span class=\"s4r-chip\">Open-case check<\u002Fspan><span class=\"s4r-chip\">Priority score (composite)<\u002Fspan><span class=\"s4r-chip\">Issue decomposition<\u002Fspan><span class=\"s4r-chip\">Override rules<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"s4r-why\">Prepares the case before any routing decision. Composite priority score = entitlement + severity + time sensitivity + financial impact + customer relationship. Override decision happens here.<\u002Fdiv>\n          <div class=\"s4r-flag\"><span class=\"s4r-tag s4r-tag--new\">NEW · BRIDGE<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"s4r-row\">\n          <div class=\"s4r-l\">\n            <div class=\"s4r-id\">L4<\u002Fdiv>\n            <div class=\"s4r-name\">\n              <div class=\"s4r-name-text\">GenOS<\u002Fdiv>\n              <div class=\"s4r-sub\">Six productivity agents<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s4r-tags\">\n            <span class=\"s4r-chip\">Accounting<\u002Fspan><span class=\"s4r-chip\">Payroll<\u002Fspan><span class=\"s4r-chip\">Payments<\u002Fspan><span class=\"s4r-chip\">Finance<\u002Fspan><span class=\"s4r-chip\">Tax<\u002Fspan><span class=\"s4r-chip\">Customer<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"s4r-why\">Productivity agents — not support agents. Detect issues while doing their job → triggers Flow 1.<\u002Fdiv>\n          <div class=\"s4r-flag\"><span class=\"s4r-tag s4r-tag--ex\">EXISTING<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"s4r-row\">\n          <div class=\"s4r-l\">\n            <div class=\"s4r-id\">L5<\u002Fdiv>\n            <div class=\"s4r-name\">\n              <div class=\"s4r-name-text\">GenRuntime<\u002Fdiv>\n              <div class=\"s4r-sub\">Resolution Agent · GenUX<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s4r-tags\">\n            <span class=\"s4r-chip\">GenRuntime (orchestrator)<\u002Fspan><span class=\"s4r-chip s4r-chip--new\">Resolution Agent (max 2 attempts · 1 Q)<\u002Fspan><span class=\"s4r-chip\">GenUX (handoff bundle → VEP)<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"s4r-why\">Never auto-executes high-stakes actions. Payroll · tax · payments — proposed, never autonomous.<\u002Fdiv>\n          <div class=\"s4r-flag\"><span class=\"s4r-tag s4r-tag--new\">HYBRID · BRIDGE<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"s4r-row\">\n          <div class=\"s4r-l\">\n            <div class=\"s4r-id\">L7<\u002Fdiv>\n            <div class=\"s4r-name\">\n              <div class=\"s4r-name-text\">Routing<\u002Fdiv>\n              <div class=\"s4r-sub\">Just routes — to humans<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s4r-tags\">\n            <span class=\"s4r-chip\">Skill match<\u002Fspan><span class=\"s4r-chip\">Language<\u002Fspan><span class=\"s4r-chip\">Tier<\u002Fspan><span class=\"s4r-chip\">Capacity prediction<\u002Fspan><span class=\"s4r-chip\">SLA window<\u002Fspan><span class=\"s4r-chip\">Case team formation<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"s4r-why\">Fires only when needed — when override applies or AI fails. Forms dynamic case team for multi-domain cases. Applies owner selection hierarchy.<\u002Fdiv>\n          <div class=\"s4r-flag\"><span class=\"s4r-tag s4r-tag--new\">NEW · BRIDGE<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"s4r-row\">\n          <div class=\"s4r-l\">\n            <div class=\"s4r-id\">L8<\u002Fdiv>\n            <div class=\"s4r-name\">\n              <div class=\"s4r-name-text\">Case Management<\u002Fdiv>\n              <div class=\"s4r-sub\">System of record · the bridge<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s4r-tags\">\n            <span class=\"s4r-chip\">One case · one record · forever<\u002Fspan><span class=\"s4r-chip\">Entitlement frozen (no SLA bait-and-switch)<\u002Fspan><span class=\"s4r-chip\">Status lifecycle (system-enforced)<\u002Fspan><span class=\"s4r-chip\">Case Owner (never empty)<\u002Fspan><span class=\"s4r-chip\">SLA + comms engines<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"s4r-why\">Single source of truth. Every AI action, channel interaction, expert update recorded here. The shared data model.<\u002Fdiv>\n          <div class=\"s4r-flag\"><span class=\"s4r-tag s4r-tag--new\">NEW · BRIDGE<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"s4r-row\">\n          <div class=\"s4r-l\">\n            <div class=\"s4r-id\">L9<\u002Fdiv>\n            <div class=\"s4r-name\">\n              <div class=\"s4r-name-text\">VEP<\u002Fdiv>\n              <div class=\"s4r-sub\">Human + AI assist<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s4r-tags\">\n            <span class=\"s4r-chip\">Resolution timeline (not a ticket)<\u002Fspan><span class=\"s4r-chip\">Dynamic case team<\u002Fspan><span class=\"s4r-chip\">KB + next action<\u002Fspan><span class=\"s4r-chip\">Draft reply<\u002Fspan><span class=\"s4r-chip\">Anomaly warning<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"s4r-why\">Expert sees what already happened. Never asks customer to repeat. AI augments — judgment stays with expert.<\u002Fdiv>\n          <div class=\"s4r-flag\"><span class=\"s4r-tag s4r-tag--ex\">EXISTING<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"s4r-row\">\n          <div class=\"s4r-l\">\n            <div class=\"s4r-id\">L10<\u002Fdiv>\n            <div class=\"s4r-name\">\n              <div class=\"s4r-name-text\">Back-end<\u002Fdiv>\n              <div class=\"s4r-sub\">Foundation<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s4r-tags\">\n            <span class=\"s4r-chip\">Unified customer ID (CRITICAL)<\u002Fspan><span class=\"s4r-chip\">QBO telemetry<\u002Fspan><span class=\"s4r-chip\">Knowledge base (AI-maintained)<\u002Fspan><span class=\"s4r-chip\">Expert perf · capacity<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"s4r-why\">Unified ID is the dependency that determines whether Year 1 ships in 12 months — or 18.<\u002Fdiv>\n          <div class=\"s4r-flag\"><span class=\"s4r-tag s4r-tag--ex\">EXISTING<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- L11 Notifications vertical column -->\n          <aside class=\"s4r-l11\">\n            <div class=\"s4r-l11-head\">\n              <div class=\"s4r-id s4r-id--l11\">L11<\u002Fdiv>\n              <div class=\"s4r-name-text\">Notifications<\u002Fdiv>\n              <div class=\"s4r-sub\">A capability — not a system<\u002Fdiv>\n              <div class=\"s4r-flag s4r-flag--inline\"><span class=\"s4r-tag s4r-tag--new\">NEW · BRIDGE<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"s4r-l11-body\">\n              <div class=\"s4r-l11-blurb\">Touches every layer. Every state change fires a notification:<\u002Fdiv>\n              <ul class=\"s4r-l11-list\">\n                <li>Case opened<\u002Fli>\n                <li>Expert assigned<\u002Fli>\n                <li>Issue found<\u002Fli>\n                <li>Action taken<\u002Fli>\n                <li>Input needed<\u002Fli>\n                <li>SLA approaching<\u002Fli>\n                <li>Resolved<\u002Fli>\n              <\u002Ful>\n              <div class=\"s4r-l11-foot\">\n                <strong>Every customer · every tier · no exceptions.<\u002Fstrong>\n                Mechanism differs (in-app · email · SMS · named-coordinator call) — commitment is identical.\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Faside>\n        <\u002Fdiv>\n\n        <!-- L12 AI Learning banner -->\n        <div class=\"s4r-banner s4r-banner--bottom\">\n          <div class=\"s4r-banner-l\">\n            <div class=\"s4r-id s4r-id--banner s4r-id--learning\">L12<\u002Fdiv>\n            <div class=\"s4r-banner-name\">\n              <div class=\"s4r-name-text\">AI Learning<\u002Fdiv>\n              <div class=\"s4r-sub\">Flywheel — every closed case improves the next<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s4r-banner-tags\">\n            <span class=\"s4r-chip\">(1) Routing algorithm updates<\u002Fspan>\n            <span class=\"s4r-chip\">(2) KB drafts from successful paths<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"s4r-banner-why\">Year 3 routing dramatically more accurate than Year 1.<\u002Fdiv>\n          <div class=\"s4r-flag\"><span class=\"s4r-tag s4r-tag--new\">NEW · BRIDGE<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <!-- BOTTOM CALLOUT -->\n      <div class=\"s4r-callout\">\n        <span class=\"s4r-callout-label\">THE POINT<\u002Fspan>\n        <span class=\"s4r-callout-body\"><strong>Single-threaded ownership is architecturally real<\u002Fstrong> because every layer operates on <em>the same data model<\u002Fem>. Same case. Same record. Same context.<\u002Fspan>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n  <\u002Fsection>\n\n  <section data-label=\"05 When AI sees the problem\" class=\"s5 s5a\" data-om-validate=\"\">\n\n    <div class=\"s5-bar\" aria-hidden=\"true\"><\u002Fdiv>\n\n    <div class=\"s5-frame\">\n\n      <div class=\"s5-head\">\n        <div class=\"s5-headtext\">\n          <div class=\"s5-eyebrow\"><span class=\"num\">05<\u002Fspan><span class=\"rule\"><\u002Fspan><span>FLOW 1 · PROACTIVE<\u002Fspan><\u002Fdiv>\n          <h2 class=\"s5-title\">When AI sees the problem <span class=\"accent\">before the customer does<\u002Fspan><\u002Fh2>\n          <p class=\"s5-subtitle\">Product agent detects · <strong>GenSRF logs evidence<\u002Fstrong> · Normalization prepares the case · <strong>Override Rule Engine evaluates policy<\u002Fstrong> · Resolution Agent attempts (if AI-allowed) · escalation routes to expert with full context.<\u002Fp>\n        <\u002Fdiv>\n\n          <div class=\"s5x-legend\">\n            <div class=\"row\">\n              <div class=\"item main\"><span class=\"line\"><\u002Fspan>Main flow<\u002Fdiv>\n              <div class=\"item success\"><span class=\"line\"><\u002Fspan>Resolved<\u002Fdiv>\n              <div class=\"item fail\"><span class=\"line dashed\"><\u002Fspan>Failed / human-only<\u002Fdiv>\n              <div class=\"item loop\"><span class=\"line dashed\"><\u002Fspan>Learning loop<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"s5x-stage\">\n        <div class=\"s5x-grid\">\n\n          <div class=\"s5x-phaserow\">\n            <div class=\"s5x-phase\"><div class=\"num\">01<\u002Fdiv><div class=\"name\">Detect<\u002Fdiv><\u002Fdiv>\n            <div class=\"s5x-phase\"><div class=\"num\">02<\u002Fdiv><div class=\"name\">Log + guard<\u002Fdiv><\u002Fdiv>\n            <div class=\"s5x-phase\"><div class=\"num\">03<\u002Fdiv><div class=\"name\">Normalize<\u002Fdiv><\u002Fdiv>\n            <div class=\"s5x-phase\"><div class=\"num\">04<\u002Fdiv><div class=\"name\">Policy check<\u002Fdiv><\u002Fdiv>\n            <div class=\"s5x-phase\"><div class=\"num\">05<\u002Fdiv><div class=\"name\">Decision<\u002Fdiv><\u002Fdiv>\n            <div class=\"s5x-phase\"><div class=\"num\">06<\u002Fdiv><div class=\"name\">Auto-resolve<\u002Fdiv><\u002Fdiv>\n            <div class=\"s5x-phase\"><div class=\"num\">07<\u002Fdiv><div class=\"name\">Route<\u002Fdiv><\u002Fdiv>\n            <div class=\"s5x-phase\"><div class=\"num\">08<\u002Fdiv><div class=\"name\">Case + team<\u002Fdiv><\u002Fdiv>\n            <div class=\"s5x-phase\"><div class=\"num\">09<\u002Fdiv><div class=\"name\">Resolve<\u002Fdiv><\u002Fdiv>\n            <div class=\"s5x-phase\"><div class=\"num\">10<\u002Fdiv><div class=\"name\">Close + learn<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"s5x-lanes\" style=\"height:720px;\">\n\n            <div class=\"s5x-lane lane-cust\" style=\"top:60px;height:152px;\">\n              <div class=\"s5x-lane-header\">\n                <div class=\"lh-tag\">L1 · L11<\u002Fdiv>\n                <div class=\"lh-label\">Customer<\u002Fdiv>\n                <div class=\"lh-sub\">Continuously informed<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"s5x-lane lane-ai\" style=\"top:220px;height:152px;\">\n              <div class=\"s5x-lane-header\">\n                <div class=\"lh-tag\">L4 · L5<\u002Fdiv>\n                <div class=\"lh-label\">AI agents<\u002Fdiv>\n                <div class=\"lh-sub\">Detect · attempt · learn<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"s5x-lane lane-sys\" style=\"top:380px;height:152px;\">\n              <div class=\"s5x-lane-header\">\n                <div class=\"lh-tag\">L2·3·6·7·8·12<\u002Fdiv>\n                <div class=\"lh-label\">System<\u002Fdiv>\n                <div class=\"lh-sub\">Channel · normalize · route · case · learn<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"s5x-lane lane-human\" style=\"top:540px;height:152px;\">\n              <div class=\"s5x-lane-header\">\n                <div class=\"lh-tag\">L9<\u002Fdiv>\n                <div class=\"lh-label\">Human (VEP)<\u002Fdiv>\n                <div class=\"lh-sub\">Owner + dynamic team<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"s5x-ribbon\" style=\"left:156px;right:0;top:32px;\">\n              <span class=\"r-tag\">L11 · NOTIFICATIONS<\u002Fspan>\n              <span class=\"r-text\">Every state change → in-app · email · SMS · named-coordinator call<\u002Fspan>\n            <\u002Fdiv>\n\n            <div class=\"s5x-ribbon ribbon-sec\" style=\"left:156px;right:0;top:702px;\">\n              <span class=\"r-tag\">L6 · GENSRF<\u002Fspan>\n              <span class=\"r-text\">Verifies · logs · gates every AI action across all steps. No AI action propagates without GenSRF. Every AI decision is defensible, traceable, and reversible.<\u002Fspan>\n            <\u002Fdiv>\n\n\n          <svg class=\"s5x-connectors\" viewBox=\"0 0 1790 700\" preserveAspectRatio=\"none\">\n            <defs>\n              <marker id=\"ah-main-5a\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"4\" orient=\"auto\" markerUnits=\"userSpaceOnUse\">\n                <path d=\"M 0 0 L 8 4 L 0 8 z\" fill=\"#475569\"><\u002Fpath>\n              <\u002Fmarker>\n              <marker id=\"ah-success-5a\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"4\" orient=\"auto\" markerUnits=\"userSpaceOnUse\">\n                <path d=\"M 0 0 L 8 4 L 0 8 z\" fill=\"#2F8E5F\"><\u002Fpath>\n              <\u002Fmarker>\n              <marker id=\"ah-fail-5a\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"4\" orient=\"auto\" markerUnits=\"userSpaceOnUse\">\n                <path d=\"M 0 0 L 8 4 L 0 8 z\" fill=\"#C44545\"><\u002Fpath>\n              <\u002Fmarker>\n              <marker id=\"ah-loop-5a\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"4\" orient=\"auto\" markerUnits=\"userSpaceOnUse\">\n                <path d=\"M 0 0 L 8 4 L 0 8 z\" fill=\"#6B5BD6\"><\u002Fpath>\n              <\u002Fmarker>\n            <\u002Fdefs>\n            <!-- 01 AI → 02 GENSRF (drop down to system lane) -->\n            <path class=\"conn-main\" d=\"M 237.7 363.5 C 237.7 456, 335.09999999999997 356, 335.09999999999997 456\" marker-end=\"url(#ah-main-5a)\"><\u002Fpath>\n            <!-- 02 → 03 -->\n            <path class=\"conn-main\" d=\"M 467.09999999999997 456 L 498.5 456\" marker-end=\"url(#ah-main-5a)\"><\u002Fpath>\n            <!-- 03 → 04 -->\n            <path class=\"conn-main\" d=\"M 630.5 456 L 661.9000000000001 456\" marker-end=\"url(#ah-main-5a)\"><\u002Fpath>\n            <!-- 04 → 05 diamond -->\n            <path class=\"conn-main\" d=\"M 793.9000000000001 456 L 845.3000000000001 456\" marker-end=\"url(#ah-main-5a)\"><\u002Fpath>\n            <!-- 05 YES → 06 Resolution Agent (up to AI lane) -->\n            <path class=\"conn-success\" d=\"M 891.3000000000001 410 C 891.3000000000001 376, 988.7 356, 988.7 296\" marker-end=\"url(#ah-success-5a)\"><\u002Fpath>\n            <!-- 05 NO → 07 Routing (skip diagonally) -->\n            <path class=\"conn-fail\" d=\"M 937.3000000000001 456 L 1152.1000000000001 456\" marker-end=\"url(#ah-fail-5a)\"><\u002Fpath>\n            <!-- 06 RESOLVED → 10 Customer (long arc to customer lane) -->\n            <path class=\"conn-success\" d=\"M 1120.7 266 C 1381.5 216, 1544.9 116, 1642.3000000000002 136\" marker-end=\"url(#ah-success-5a)\"><\u002Fpath>\n            <!-- 06 FAILED → 07 Routing (drop into system lane) -->\n            <path class=\"conn-fail\" d=\"M 1054.7 363.5 C 1054.7 426, 1152.1000000000001 426, 1152.1000000000001 456\" marker-end=\"url(#ah-fail-5a)\"><\u002Fpath>\n            <!-- 07 → 08 Case Mgmt -->\n            <path class=\"conn-main\" d=\"M 1284.1000000000001 456 L 1315.5 456\" marker-end=\"url(#ah-main-5a)\"><\u002Fpath>\n            <!-- 08 → 09 Expert (drop to human lane) -->\n            <path class=\"conn-main\" d=\"M 1395.5 528.5 C 1395.5 586, 1478.9 586, 1478.9 616\" marker-end=\"url(#ah-main-5a)\"><\u002Fpath>\n            <!-- 09 Expert → 10 Customer Confirms (up to customer lane) -->\n            <path class=\"conn-main\" d=\"M 1544.9 548.5 C 1544.9 456, 1642.3000000000002 216, 1642.3000000000002 136\" marker-end=\"url(#ah-main-5a)\"><\u002Fpath>\n            <!-- 10 Customer → AI Learning (down) -->\n            <path class=\"conn-loop\" d=\"M 1708.3000000000002 203.5 L 1708.3000000000002 388.5\" marker-end=\"url(#ah-loop-5a)\"><\u002Fpath>\n\n            <!-- Labels -->\n            <text x=\"887.3000000000001\" y=\"388\" class=\"lbl-success\" text-anchor=\"middle\" style=\"paint-order:stroke;stroke:#fff;stroke-width:4px;\">Yes<\u002Ftext>\n            <text x=\"1054.7\" y=\"448\" class=\"lbl-fail\" text-anchor=\"middle\" style=\"paint-order:stroke;stroke:#fff;stroke-width:4px;\">No — human only<\u002Ftext>\n            <text x=\"1351.5\" y=\"236\" class=\"lbl-success\" text-anchor=\"middle\" style=\"paint-order:stroke;stroke:#fff;stroke-width:4px;\">Resolved ≈ 80%<\u002Ftext>\n            <text x=\"1124.7\" y=\"418\" class=\"lbl-fail\" text-anchor=\"middle\" style=\"paint-order:stroke;stroke:#fff;stroke-width:4px;\">Failed<\u002Ftext>\n            <text x=\"1734.3000000000002\" y=\"296\" class=\"\" text-anchor=\"middle\" style=\"paint-order:stroke;stroke:#fff;stroke-width:4px;fill:#6B5BD6;\">Learn<\u002Ftext>\n          <\u002Fsvg>\n\n          <div class=\"s5x-card ai\" style=\"left:171.7px;top:228.5px;width:132px;height:135px;\">\n            <div class=\"c-tag\"><span class=\"layer\">L4<\u002Fspan><span>PRODUCT AGENT<\u002Fspan><\u002Fdiv>\n            <div class=\"c-title\">Detects anomaly<\u002Fdiv>\n            <div class=\"c-body\">Payroll fail · reconciliation · deposit hold · security signal. <strong>Customer not yet aware.<\u002Fstrong><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s5x-card sec\" style=\"left:335.09999999999997px;top:388.5px;width:132px;height:135px;\">\n            <div class=\"c-tag\"><span class=\"layer\">L6<\u002Fspan><span>GENSRF<\u002Fspan><\u002Fdiv>\n            <div class=\"c-title\">Logs evidence + guardrails<\u002Fdiv>\n            <div class=\"c-body\">Forensic trail. Privacy + compliance rails on every action that follows.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s5x-card sys\" style=\"left:498.5px;top:388.5px;width:132px;height:135px;\">\n            <div class=\"c-tag\"><span class=\"layer\">L3<\u002Fspan><span>NORMALIZATION<\u002Fspan><\u002Fdiv>\n            <div class=\"c-title\">Prepare the case<\u002Fdiv>\n            <div class=\"c-body\">Identity · entitlement snap · open-case check · <strong>priority score<\u002Fstrong> · decompose.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s5x-card sys highlight\" style=\"left:661.9000000000001px;top:388.5px;width:132px;height:135px;\">\n            <div class=\"c-tag\"><span class=\"layer\">L3<\u002Fspan><span>OVERRIDE RULE ENGINE<\u002Fspan><\u002Fdiv>\n            <div class=\"c-title\">Evaluate policy<\u002Fdiv>\n            <div class=\"c-body\">Tier · regulatory · risk class · customer flags · priority threshold.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s5x-decision\" style=\"left:845.3000000000001px;top:410px;width:92px;height:92px;\">\n            <div class=\"d-inner\">\n              <div class=\"d-tag\">BRANCH<\u002Fdiv>\n              <div class=\"d-label\">AI allowed?<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s5x-card ai\" style=\"left:988.7px;top:228.5px;width:132px;height:175px;\">\n            <div class=\"c-tag\"><span class=\"layer\">L5<\u002Fspan><span>RESOLUTION AGENT<\u002Fspan><\u002Fdiv>\n            <div class=\"c-title\">Auto-fix · max 2 attempts<\u002Fdiv>\n            <div class=\"c-body\">Diagnose → try → verify. <strong>Every action verified by GenSRF<\u002Fstrong> — propose, approve, execute, escalate all logged. <strong>Hard cap to prevent loops.<\u002Fstrong><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s5x-card sys\" style=\"left:1152.1000000000001px;top:388.5px;width:132px;height:135px;\">\n            <div class=\"c-tag\"><span class=\"layer\">L7<\u002Fspan><span>ROUTING<\u002Fspan><\u002Fdiv>\n            <div class=\"c-title\">Skill match + capacity<\u002Fdiv>\n            <div class=\"c-body\">Match by skill, language, tier. Honour capacity + SLA. Form case team.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s5x-card sys has-team\" style=\"left:1301.5px;top:383.5px;width:160px;height:145px;\">\n            <div class=\"c-tag\"><span class=\"layer\">L8<\u002Fspan><span>CASE MGMT<\u002Fspan><\u002Fdiv>\n            <div class=\"c-title\">Case · single owner + dynamic team<\u002Fdiv>\n            <div class=\"c-body\"><strong>One named owner<\u002Fstrong> end-to-end. Team flexes with scope.<\u002Fdiv>\n            <div class=\"c-team\">\n              <span class=\"chip owner\">★ Owner<\u002Fspan>\n              <span class=\"chip\">Tax<\u002Fspan>\n              <span class=\"chip\">Books<\u002Fspan>\n              <span class=\"chip ghost\">+ more<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s5x-card human\" style=\"left:1478.9px;top:548.5px;width:132px;height:135px;\">\n            <div class=\"c-tag\"><span class=\"layer\">L9<\u002Fspan><span>EXPERT (VEP)<\u002Fspan><\u002Fdiv>\n            <div class=\"c-title\">Resolves with full context<\u002Fdiv>\n            <div class=\"c-body\">Timeline + KB + suggested action. <strong>Customer never re-explains.<\u002Fstrong><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s5x-card cust\" style=\"left:1642.3000000000002px;top:68.5px;width:132px;height:135px;\">\n            <div class=\"c-tag\"><span class=\"layer\">L1<\u002Fspan><span>CUSTOMER<\u002Fspan><\u002Fdiv>\n            <div class=\"c-title\">Confirms resolved<\u002Fdiv>\n            <div class=\"c-body\">AI fast-path or expert-path — <strong>same confirmation moment.<\u002Fstrong><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s5x-card sys\" style=\"left:1642.3000000000002px;top:388.5px;width:132px;height:135px;\">\n            <div class=\"c-tag\"><span class=\"layer\">L12<\u002Fspan><span>AI LEARNING<\u002Fspan><\u002Fdiv>\n            <div class=\"c-title\">KB + routing weights<\u002Fdiv>\n            <div class=\"c-body\">Successful path → KB draft. Outcome → routing weights. <em>Year 3 ≫ Year 1.<\u002Fem><\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"s5x-take\">\n        <div class=\"label-tag\">Why it works<\u002Fdiv>\n        <div class=\"body-text\"><strong>AI agents detect while doing their job.<\u002Fstrong> Normalization prepares the case so override rules can use priority data. The <strong>Override Rule Engine<\u002Fstrong> gates AI on policy — security signals or regulated workflows go straight to a human. When a case opens, <strong>one named owner stays for the lifetime;<\u002Fstrong> the team around them grows or shrinks as scope evolves. <em>Customer always knows who to ask.<\u002Fem><\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n  <\u002Fsection>\n\n  <section data-label=\"06 When the customer sees it\" class=\"s5 s5b\" data-om-validate=\"\">\n\n    <div class=\"s5-bar\" aria-hidden=\"true\"><\u002Fdiv>\n\n    <div class=\"s5-frame\">\n\n      <div class=\"s5-head\">\n        <div class=\"s5-headtext\">\n          <div class=\"s5-eyebrow\"><span class=\"num\">06<\u002Fspan><span class=\"rule\"><\u002Fspan><span>FLOW 2 · REACTIVE<\u002Fspan><\u002Fdiv>\n          <h2 class=\"s5-title\">When the customer sees it <span class=\"accent\">first<\u002Fspan><\u002Fh2>\n          <p class=\"s5-subtitle\">Customer reaches out · Normalization prepares the case · <strong>Override Rule Engine evaluates policy<\u002Fstrong> · AI attempts triage (if allowed) · expert resolves with full context. <strong>Same single-owner + dynamic-team model<\u002Fstrong> as Flow 1.<\u002Fp>\n        <\u002Fdiv>\n\n          <div class=\"s5x-legend\">\n            <div class=\"row\">\n ss=\"c-title\">Evaluate policy<\u002Fdiv>\n            <div class=\"c-body\">Tier · <strong>Live Expert Full-Service<\u002Fstrong> · regulatory · risk class · priority threshold.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s5x-decision\" style=\"left:845.3px;top:410px;width:92px;height:92px;\">\n            <div class=\"d-inner\">\n              <div class=\"d-tag\">BRANCH<\u002Fdiv>\n              <div class=\"d-label\">AI allowed?<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s5x-card ai\" style=\"left:988.7px;top:228.5px;width:132px;height:175px;\">\n            <div class=\"c-tag\"><span class=\"layer\">L5<\u002Fspan><span>RESOLUTION AGENT<\u002Fspan><\u002Fdiv>\n            <div class=\"c-title\">Triage · max 2 attempts<\u002Fdiv>\n            <div class=\"c-body\">Try → verify → try again. <strong>Every action verified by GenSRF.<\u002Fstrong> <strong>Cap at 2 to prevent loops.<\u002Fstrong><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s5x-card sys\" style=\"left:1152.1px;top:388.5px;width:132px;height:135px;\">\n            <div class=\"c-tag\"><span class=\"layer\">L7<\u002Fspan><span>ROUTING<\u002Fspan><\u002Fdiv>\n            <div class=\"c-title\">Skill match + capacity<\u002Fdiv>\n            <div class=\"c-body\">Match by skill, language, tier. Honour capacity + SLA. Form case team.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s5x-card sys has-team\" style=\"left:1301.5px;top:383.5px;width:160px;height:145px;\">\n            <div class=\"c-tag\"><span class=\"layer\">L8<\u002Fspan><span>CASE MGMT<\u002Fspan><\u002Fdiv>\n            <div class=\"c-title\">Case · single owner + dynamic team<\u002Fdiv>\n            <div class=\"c-body\"><strong>One named owner<\u002Fstrong> end-to-end. Team flexes with scope.<\u002Fdiv>\n            <div class=\"c-team\">\n              <span class=\"chip owner\">★ Owner<\u002Fspan>\n              <span class=\"chip\">Tax<\u002Fspan>\n              <span class=\"chip\">Books<\u002Fspan>\n              <span class=\"chip ghost\">+ more<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s5x-card human\" style=\"left:1478.9px;top:548.5px;width:132px;height:135px;\">\n            <div class=\"c-tag\"><span class=\"layer\">L9<\u002Fspan><span>EXPERT (VEP)<\u002Fspan><\u002Fdiv>\n            <div class=\"c-title\">Resolves with full context<\u002Fdiv>\n            <div class=\"c-body\">Timeline + KB + suggested action. <strong>Customer never re-explains.<\u002Fstrong><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s5x-card cust\" style=\"left:1642.3px;top:68.5px;width:132px;height:135px;\">\n            <div class=\"c-tag\"><span class=\"layer\">L1<\u002Fspan><span>CUSTOMER<\u002Fspan><\u002Fdiv>\n            <div class=\"c-title\">Confirms resolved<\u002Fdiv>\n            <div class=\"c-body\">Single confirmation moment — <strong>AI-resolved or expert-resolved.<\u002Fstrong><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s5x-card sys\" style=\"left:1642.3px;top:388.5px;width:132px;height:135px;\">\n            <div class=\"c-tag\"><span class=\"layer\">L12<\u002Fspan><span>AI LEARNING<\u002Fspan><\u002Fdiv>\n            <div class=\"c-title\">Feedback → routing weights<\u002Fdiv>\n            <div class=\"c-body\">Outcome scoring · KB drafts · expert performance. <em>Year 3 ≫ Year 1.<\u002Fem><\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"s5x-take\">\n        <div class=\"label-tag\">Why it works<\u002Fdiv>\n        <div class=\"body-text\"><strong>Override Rule Engine<\u002Fstrong> is the same gate on both flows — Live Expert Full-Service, regulatory, risk class all skip AI. <strong>Entitlement is snapshotted<\u002Fstrong> at moment of contact. <strong>Single-threaded ownership<\u002Fstrong> with a dynamic case team — one owner, many specialists. <em>Same data model as Flow 1; the learning loop fuses both.<\u002Fem><\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n  <\u002Fsection>\n\n  <!-- ============================================================\n       SLIDE 8 — UNIFIED CASE DATA MODEL\n       ============================================================ -->\n  <section data-label=\"07 Unified Case Data Model\" class=\"s8\" data-om-validate=\"\">\n\n    <div class=\"s8-bar\" aria-hidden=\"true\"><\u002Fdiv>\n\n    <div class=\"s8-frame\">\n\n      <div class=\"s8-head\">\n        <div>\n          <div class=\"s8-eyebrow\">\n            <span class=\"num\">007<\u002Fspan>\n            <span class=\"rule\"><\u002Fspan>\n            <span>Data Architecture<\u002Fspan>\n          <\u002Fdiv>\n          <h1 class=\"s8-title\">The unified case <span class=\"accent\">data model<\u002Fspan><\u002Fh1>\n          <p class=\"s8-subtitle\">What single-threaded ownership looks like at the data layer. <strong>The case is the system of record<\u002Fstrong> — one case, one record, one owner, for the entire lifetime.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"s8-body\">\n\n        <!-- LEFT: ER diagram -->\n        <div class=\"s8-erd\">\n          <div class=\"s8-erd-header\">\n            <span class=\"erd-tag\">ENTITY · RELATIONSHIP<\u002Fspan>\n            <span class=\"erd-caption\">7 entities · all bound to the Case<\u002Fspan>\n          <\u002Fdiv>\n\n          <svg viewBox=\"0 0 1820 640\" xmlns=\"http://www.w3.org/2000/svg\" class=\"s8-erd-svg\" preserveAspectRatio=\"xMidYMid meet\">\n\n            <!-- relationship lines -->\n            <g class=\"erd-rels\">\n              <!-- CUSTOMER → CASE (raises): top horizontal -->\n              <path d=\"M 300 98 L 760 98\"><\u002Fpath>\n\n              <!-- CASE → EXPERT (handled_by): top horizontal -->\n              <path d=\"M 1060 98 L 1500 98\"><\u002Fpath>\n\n              <!-- CASE → ENTITLEMENT (governed_by): left side, around Interaction -->\n              <pat

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"0778d7e0-b6d7-4e61-bc87-a3fa55e7afb4\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"4161ad01-c48a-4339-bc94-38334c494e1b\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"4f24e21b-cf88-4719-bef9-ad19b5d4b314\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"97de0108-7944-47cf-b9f5-8e84ee208cbf\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"44fb9c85-d1f8-4666-997b-04eec48ccb29\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"9085aa02-0fb2-42d5-8beb-1a2d3e80509c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"a81b64d8-8b86-4d2d-bcfc-1993928279d8\"><\u002Fscript>\n\n<script type=\"application/json\" id=\"speaker-notes\">\n[\n  \"Thank you for the opportunity to present this case study. Over the next 25 minutes I will walk you through my approach to designing a target-state architecture for GBSG's case management transformation — one that bridges AI and human intelligence and is anchored by single-threaded ownership. I will cover discovery, the customer journey, the target architecture, the unified case data model, the 3-year roadmap, and how I would measure success. I welcome questions at the end — please interrupt at any time. The deeper we go, the better. Let me start with the problem framing.\",\n  \"Let me start with a customer scenario.\\n\\nA small business owner emails Intuit support Monday about a payroll issue. Doesn't get a timely response. Calls Wednesday. Re-explains from scratch. Two separate cases for one issue.\\n\\nThis is fragmented support. Reactive — Intuit only knows after she reports. Customer-driven — she follows up, she carries the context. Context-leaking — every handoff loses what came before.\\n\\nNow imagine the target state.\\n\\nIntuit's payroll AI agent detects the anomaly first. Flags it to her proactively. She chats with Intuit Assist to understand what happened. Then she calls.\\n\\nThe expert who picks up sees everything. The anomaly detection. The Intuit Assist conversation. The customer never re-explains because context travels with the case, not with the customer. As the expert works, she receives proactive updates. AI assists the expert to resolve faster.\\n\\nThe intelligence already exists at Intuit — product agents, Intuit Assist, the Virtual Expert Platform. What's missing is the case management bridge that connects them.\\n\\nBuilding that bridge — enhanced by Intuit's AI — is how we achieve single-threaded ownership.\\n\\nThat is what I would build. Let me show you how.\",\n  \"Before I show you what I would build, let me tell you what I would validate first.\\n\\nIn a real engagement, discovery is grounded in data — case volumes, repeat contact rates, SLA breach reasons, identity coverage gaps. In this case study I do not have GBSG's data. So I structured discovery as hypotheses based on how large enterprises typically operate at this scale. Each assumption is testable. The architecture stays regardless. The timing flexes.\\n\\nFive questions. Five assumptions.\\n\\nSystem dependencies. What systems hold customer and case data today? My assumption is multiple disconnected systems — CRMs split by sub-segment, identity does not stitch reliably across QBO, Payroll, Mailchimp, IES. This breaks entitlement calculation, SLA assignment, and omni-channel routing. The foundational dependency.\\n\\nCase continuity. How does context travel across channels and AI interactions today? My assumption is cases get duplicated. Context does not travel with the case. Customers re-explain. Summaries are buried in unstructured notes.\\n\\nMulti-team coordination. How do multi-expert cases coordinate today? My assumption is routing happens via internal tickets. No consolidated view of who is working on what. No summarization for the case owner. The customer follows up.\\n\\nProactive communication. How does the system notify customers today? My assumption is no proactive engine. Updates are pulled, not pushed. The customer tracks status. No state-change notifications.\\n\\nAI resolution capability. What AI resolves cases today? My assumption is product agents detect anomalies. Intuit Assist converses. But no agent proposes or executes resolutions. Every case requires full human work.\\n\\nThese five assumptions shape the architecture. If discovery reveals different facts — the architecture stays, the timing flexes.\\n\\nLet me show you the target state.\",\n  \"This is the target state architecture — twelve layers working together to bridge AI and human intelligence into a single, unified case lifecycle. Most of these layers exist today. What's new is the case-management bridge — the layers tagged in blue — that connects them all to one shared data model.\\n\\nLet me orient you to the structure. GenSRF spans the top — it secures every action AI takes, end-to-end, and cannot be bypassed. AI Learning spans the bottom — it's the flywheel that makes Year 3 routing dramatically better than Year 1. Notifications runs as a vertical column on the right because it touches every single layer — every state change fires a notification, on every customer, every tier, no exceptions.\\n\\nThe nine layers in the middle stack vertically. The yellow tags are existing capabilities. The blue tags — Normalization, Routing, Case Management — are the new bridge. L3 Normalization is the brain — it composes the priority score, runs the override decision, and prepares the case before any routing happens. L8 Case Management is the system of record — one case, one record, forever, with the entitlement frozen so there's no SLA bait-and-switch. L7 Routing only fires when needed — when override applies or AI fails — and it forms the dynamic case team for multi-domain cases.\\n\\nThe point at the bottom is the architectural punchline — customer-facing, AI-driven, and human plus system layers all operate on the same data model. Same case. Same record. Same context. That is what makes single-threaded ownership architecturally real across a twelve-layer system.\",\n  \"This is Flow 1 — when AI sees the problem before the customer does. Ten steps across four lanes — Customer, AI agents, System, and Human in VEP.\\n\\nTwo cross-cutting layers frame the entire flow. L11 Notifications across the top — every state change fires a customer notification. L6 GenSRF across the bottom — verifies, logs, and gates every AI action. Defensible. Traceable. Reversible. GenSRF is not a step. It is a continuous gate. No AI action propagates without it.\\n\\nStep one — detect. A product agent is monitoring customer data continuously inside QuickBooks. Payroll Agent notices payroll did not run on schedule. Accounting Agent notices a reconciliation discrepancy. Payments Agent sees a deposit on hold. The customer has not contacted Intuit yet. Intuit already knows.\\n\\nStep two — log and guard. GenSRF immediately captures forensic evidence and applies privacy and compliance rails on every action that follows. Every AI action from this moment is auditable.\\n\\nStep three — normalize. The case is prepared before any decision is made. Normalization runs six services in sequence. Customer identity resolved across all GBSG products. All active subscriptions queried. Highest entitlement tier snapshotted onto the case and frozen for the lifetime. Open case check — if a case already exists for this issue, the new interaction appends. No duplicates. Priority score calculated as a composite — entitlement plus severity plus time sensitivity plus financial impact plus customer relationship. Issue decomposed into domain components. The case is fully prepared and structured.\\n\\nStep four — policy check. The Override Rule Engine evaluates the normalized case. Tier, regulatory class, risk class, customer flags, priority threshold. It outputs a binary decision — AI allowed or human only. The override decision happens before AI is even considered.\\n\\nStep five is that decision branch. If override applies — security signal, regulated workflow, time-critical issue — AI is bypassed entirely. The case routes directly to human routing at step seven. If no override, we proceed to step six.\\n\\nStep six — Resolution Agent attempts the auto-fix. Maximum two attempts. Hard cap to prevent loops. Every action verified by GenSRF — proposal, approval, execution, escalation all logged. Why two attempts? Trust in financial AI is lost in buckets and regained in spoonfuls. After two failed attempts, customer patience is spent. Escalate.\\n\\nStep seven — routing. This step fires only when needed — when override applies or when AI fails. Routing matches by skill, language, tier. Honors capacity and SLA window. Forms the dynamic case team for multi-domain cases.\\n\\nStep eight — case team formation. This is where single-threaded ownership becomes operational.\\n\\nIf the case has one domain, one expert is assigned. They are the case owner. Done.\\n\\nIf the case has multiple domains, a dynamic case team forms. Case owner selection follows a clear hierarchy.\\n\\nRule one — if the customer has a named expert relationship — IES account coordinator, Live Full-Service bookkeeper, Priority Circle support team — that named expert is the case owner. Always. Regardless of issue components.\\n\\nRule two — if there is no named relationship and the customer has an existing open case, the existing case owner remains. New interactions append to the existing case.\\n\\nRule three — if it is a new case with no named relationship, the first expert assigned by routing becomes the case owner and is locked for the case lifetime.\\n\\nThe owner is one person, always. Domain specialists join the team per issue component. They work components internally inside the case. The case owner owns all customer communication. The customer talks to one person regardless of how many specialists are working internally. The team is dynamic — grows or shrinks as the case evolves. The owner stays.\\n\\nStep nine — expert resolves with full context. Timeline. KB. Suggested next action. Customer never re-explains.\\n\\nStep ten — close and learn. Customer confirms resolution. The successful path becomes a draft KB article. Outcome data updates routing weights. L12 AI Learning consumes the closed case and feeds back to routing, KB, and detection thresholds. The system gets smarter with every case.\\n\\nThe reason this flow works — AI agents detect while doing their job. Normalization prepares the case so override rules can use priority data. The Override Rule Engine gates AI on policy. When a case opens, one named owner stays for the lifetime. The team around them grows or shrinks as scope evolves. Customer always knows who to ask.\\n\\nNow Flow 2 — when the customer sees it first.\",\n  \"Flow 2 — when the customer sees it first. Same swimlane structure as Flow 1. Same four lanes. Same cross-cutting layers — Notifications across the top, GenSRF across the bottom. Ten steps.\\n\\nStep one — initiate. Customer notices something. An unexpected charge, a feature they cannot find, an error message. They may also be receiving a proactive alert from Flow 1 and reaching out to confirm.\\n\\nStep two — channel. They pick whichever channel suits them. Intuit Assist in-product. Embedded chatbot. Live chat. AI Voice Agent. Email. Web. No forced sequence. The architecture adapts to the customer choice.\\n\\nStep three — normalize. Same six services as Flow 1. Identity resolved. Subscriptions queried. Entitlement snapshotted at this exact moment. Open case check — if a case already exists for this issue, append. No duplicates. Priority scored as composite. Issue decomposed.\\n\\nStep four — policy check. Same Override Rule Engine as Flow 1. Same gate on both flows. Tier, Live Expert Full-Service, regulatory class, risk class, priority threshold all evaluated. The override decision happens before AI is even considered.\\n\\nStep five — decision branch. AI allowed or human only.\\n\\nStep six — if AI allowed, Resolution Agent triages. Same two-attempt cap. Same one clarifying question. Every action verified by GenSRF.\\n\\nStep seven — routing. Fires only when needed — when override applies or AI fails. Same routing function as Flow 1. Skill match, capacity, case team formation.\\n\\nStep eight — case team formation. Same case owner selection hierarchy as Flow 1. Named relationship wins. Existing case owner remains if there is an active open case. First respondent locked otherwise. The owner is one person, always. Specialists join per component. Customer talks to one person regardless of how many specialists are working internally. The team is dynamic — grows or shrinks. The owner stays.\\n\\nStep nine — expert resolves with full context. Timeline. KB. Suggested action. Customer never re-explains.\\n\\nStep ten — close and learn. Same feedback loop as Flow 1. L12 AI Learning consumes the closed case. Outcome scoring. KB drafts. Expert performance scoring. Year 3 routing meaningfully more accurate than Year 1.\\n\\nThe reason this flow works — Override Rule Engine is the same gate on both flows. Normalization prepares the case identically — entitlement snapshotted at moment of contact, priority scored, issue decomposed. Single-threaded ownership with a dynamic case team — one owner, many specialists. Same data model as Flow 1. The learning loop fuses both.\\n\\nTwo flows in. One case lifecycle out. The customer never re-explains. The customer never follows up. Context travels with the case end-to-end.\\n\\nThat is the architecture. Now let me show you the unified case data model that makes single-threaded ownership architecturally real.\",\n  \"Single-threaded ownership is the case study's central principle. The question is — how do you actually enforce it? Because as a principle, it is easy to say. As a system, it is hard to build.\\n\\nMy answer is — you enforce it in the data model. Not through process discipline. Not through expert training. Not through good intentions. Through the data structure itself.\\n\\nLet me walk you through the model.\\n\\nThe Case is the central object. Everything else attaches to it. Customer. Entitlement. Interaction. Case Team. AI Resolution Log. Expert.\\n\\nBefore I walk through the rules — one foundational property of this data model. Every field is AI-readable. Structured, not free text. The AI Resolution Log is not \\\"expert notes.\\\" It is structured records of what was attempted, what evidence informed it, what confidence level, what outcome. The Interaction record is not a transcript pasted into a notes field. It is structured channel of origin, sentiment, intent, resolution path.\\n\\nThis is what makes the AI learning engine work. AI cannot reliably analyze free text at scale. Structured data enables routing improvements, KB generation, expert performance scoring, predictive capabilities. If the data model were unstructured, none of the AI capabilities downstream would function. Structured-first is the architectural foundation.\\n\\nNow — the six commitments that enforce single-threaded ownership.\\n\\nFirst — one case per issue. No duplicates ever. The routing engine runs an open case check at the moment a new contact arrives. If a case already exists for this customer and this issue, the new interaction appends to it. The customer reaching out a second time about the same problem does not create case number two.\\n\\nSecond — Case Owner field is never empty. From the moment a case is created, it has an owner. AI Agent during AI resolution. A human expert after escalation. The transition is logged. There is never a moment where a case exists without someone — or something — owning it.\\n\\nThird — entitlement frozen at creation. The customer's subscription tier is snapshotted onto the case at the moment of creation. Frozen for the case lifetime. If the customer upgrades mid-case, they get the new tier on the next case, not this one. If they downgrade, they keep the original tier for this case. No SLA bait and switch in either direction.\\n\\nFourth — context travels with the case. Every interaction, every AI agent action, every expert update is logged on the case record itself in structured form. Not in expert notes. Not in another system. On the case. When the third expert in a multi-day case opens it, they see the complete history — structured and parseable — without asking the customer to repeat anything.\\n\\nFifth — customer confirms closure. An expert marking a case resolved does not move it to Resolved status. It moves to Pending Customer Confirmation. Only the customer can move it to Resolved. This is single-threaded ownership at its purest — Intuit cannot declare victory without the customer agreeing.\\n\\nSixth — case is immutable after closure. Audit trail finalized. If the customer reopens the case later because something is wrong, it preserves the original case ID. Same case continuity. The customer does not start over.\\n\\nThe point — single-threaded ownership is enforced by the data model. The system makes it impossible to lose a case, duplicate a case, or close a case without the customer. And the AI-readable structure is what makes the AI capabilities throughout the architecture actually work.\\n\\nThis is what makes the architecture from the previous slides actually work in practice. Not as a principle. As a constraint.\",\n  \"This is the three-year roadmap. The case study asks for sequencing — how I would balance immediate, no-regret foundational wins with the long-term target-state transition. Let me walk you through my approach.\\n\\nFour principles govern the entire roadmap.\\n\\nFirst — bridge what exists. Product agents work. VEP works. Intuit Assist works. The roadmap connects them, it does not rebuild them.\\n\\nSecond — AI assist is universal from Day 1, AI autonomy is gradual. Expert AI assist launches in Year 1 because it is low-risk. AI autonomous resolution starts in Year 2 with low-risk cohorts only.\\n\\nThird — foundation before intelligence. Year 1 is foundation. Year 2 is AI resolution. Year 3 is self-improving.\\n\\nFourth — discovery shapes timing. What exists today determines build versus integrate. Q1 discovery validates the state.\\n\\nNOW THE TIMELINE.\\n\\nYear 1 is foundation. Q1 is discovery only — no build. The critical Year 1 dependency is customer identity stitching across GBSG products. Without unified identity, omni-channel routing cannot work. Q1 also confirms the CRM platform decision and maps where existing AI ends and where the bridge begins. Q2 sets up the CRM platform and deploys the unified case data model. Normalization layer build begins. Q3 completes normalization, builds the override rules engine and routing engine, and brings channels online — web, email, live chat, phone, IVR, plus the bridge from Intuit Assist conversations into case management. Q4 is when L4 product agent detections start flowing into case management — Flow 1 proactive comes online. GenSRF integration is first active here. AI assist for experts launches in pilot — KB retrieval and suggested action initially. Notifications go to production. Pilot with one sub-segment validates end-to-end. There is no autonomous Resolution Agent in Year 1.\\n\\nYear 2 is when AI autonomy begins — but only for low-risk cohorts. Q5 is Resolution Agent build. Architecture, model selection, and critically — training data. Most of it comes from existing Intuit case data that is cleaned and labeled, augmented by Year 1 pilot data. GenSRF integration is extended to Resolution Agent. Q6 is limited launch — QBO Plus, Essentials, Solopreneur navigation. Payroll Core and Premium setup. Payments explanation only, not transactions. Mailchimp queries. All within low-risk cohorts. Single-domain cases first. Q7 expands scope — QBO Advanced, multi-domain cases like QBO plus Payroll combined. Confidence threshold reduced incrementally as evidence supports it. Q8 builds pattern detection groundwork. The Resolution Agent is live but only for low-risk cases.\\n\\nYear 3 is self-improving and predictive. Q9 brings full closed-loop learning into production — routing weights update from outcomes, KB drafts auto-generate from successful resolution paths, expert performance scoring feeds routing decisions. Q10 brings predictive at scale — pattern detection from Q8 goes live, proactive intervention before customer notices, predictive routing matches expert by predicted resolution success. Q11 carefully expands to higher-risk cohorts. IES medium-risk cases like reporting. Payroll Elite setup only. Live Full-Service AI assists the bookkeeper but does not replace them. AI prepares tax filing context for the human preparer — does not file. Q12 is system refinement and continuous learning. Year 3 routing measurably better than Year 1.\\n\\nCOHORT SEQUENCING\\n\\nThe visual at the bottom of the slide shows when each capability turns on. AI assist plus proactive detection is universal from Year 1 — every tier including IES, Live Full-Service, and Priority Circle. AI autonomous resolution starts in Year 2 with low-risk cohorts only, expanding carefully in Year 3. Predictive intervention begins in Year 3 as pattern detection scales.\\n\\nPERMANENT EXCLUSIONS\\n\\nThe callout at the bottom names what stays human forever. IRS interactions. Multi-entity consolidation. Security breaches. High-value payments above threshold. Worker classification decisions. The customer's books in Live Full-Service. Payroll Elite tax filings. Regulated tax filings end-to-end. Eight categories where AI does not get autonomy — by design, not by limitation. Some cases require human judgment AI cannot defend. We commit to that explicitly.\\n\\nTHE BOTTOM LINE\\n\\nTrust earns scope. AI autonomy expands as the system proves itself. Some cases stay human forever — by design, not by limitation. The architecture stays. The timing flexes based on discovery.\\n\\nNow let me show you how I would drive matrix alignment across business units.\",\n  \"The case study asks how I would drive alignment across business units with differing processes to establish shared data models and standardized workflows. My honest answer is — alignment is more politics than architecture. The architecture stays the same. What changes is the sequence of how you bring three sub-segments along.\\n\\nSIX STEPS THAT DRIVE ALIGNMENT\\n\\nStep one — find the shared pain. In Q1. Every sub-segment has been embarrassed by multi-day cases losing context. That is common ground. The conversation starts there, not on architecture.\\n\\nStep two — co-design the data model. In Q1 and Q2. Working sessions with sub-segment representatives. Build the Case object together. Eighty percent of the schema is shared. Twenty percent is sub-segment configuration. They have ownership because they helped build it.\\n\\nStep three — pilot with the willing first. In Q4. SMB Mid-Market goes first because they have the volume pain and they want this most. Six months of real cases, real metrics. Evidence accumulates while Mid-Market and Services watch.\\n\\nStep four — address each sub-segment's specific objection. In Q5 through Q7. This is where the political reality gets architectural. Mid-Market fears commoditization — the answer is the Case Owner field preserves the account manager and customer relationship history travels with the case. Services fears AI replacement — the answer is the exclusion list and AI-assists-not-replaces commitment. Customer books in Live Full-Service stays human forever. SMB Mid-Market wants to run ahead — the answer is pilot first, evidence second, expansion third. Going alone forks the data.\\n\\nStep five — lightweight governance. Throughout. Architecture Working Group with sub-segment leads plus central architecture. Open proposals for schema changes. Decisions logged with rationale. Exclusion list owned collectively — no unilateral changes. No 50-page charter.\\n\\nStep six — earn expansion through evidence. In Q7 through Q11. Mid-Market adopts in Q7 with pilot data in hand. Services adopts in Q11 with the exclusion list proven. Each adoption is voluntary, evidence-based. No mandate required.\\n\\nTHE BOTTOM LINE\\n\\nAlignment is woven through the roadmap, not bolted on as a separate program. Each sub-segment adopts when the evidence answers their specific concern. The architecture is the easy part. Sequencing three sub-segments through adoption with their specific concerns addressed — that is the work.\\n\\nNow let me show you how I would measure success.\",\n  \"The case study asks for technical and business metrics to evaluate success. Let me walk you through how I would measure whether the architecture is actually working.\\n\\nA NOTE ON TARGETS\\n\\nBefore I walk through the metrics — you will notice I am using directional framing throughout. Higher is better. Lower is better. Near zero. Measurably above baseline. I am not committing to specific numeric targets like \\\"FCR of 80% by Year 1.\\\"\\n\\nThis is deliberate. Setting specific targets requires knowing the current baseline at GBSG, which is a Q1 discovery output. Setting targets without baselines is engineering by hope. The architectural commitment is improvement and the right metrics. The specific target conversation happens with leadership in Q1 once we have the baseline data. If pushed, industry-leading FCR for B2B SaaS support is in the 70-80% range and best-in-class repeat contact rate is below 10% — but those are benchmarks, not commitments.\\n\\nFOUR CATEGORIES OF METRICS\\n\\nI organized metrics into four categories.\\n\\nCustomer Outcome — did the customer get a good experience? First Contact Resolution Rate. Repeat Contact Rate. Time to Resolution. CSAT and NPS. Customer Effort Score.\\n\\nOperational — is the system running efficiently? SLA Adherence. Number of handoffs per case. Queue Wait Time. Reopen Rate.\\n\\nAI Quality — is AI actually helping or causing problems? AI Resolution Success Rate. AI Resolution Reversal Rate. AI Escalation Quality. Expert Feedback on AI.\\n\\nSystem Health, the technical category — is the architecture itself sound? Bridge Availability. GenSRF Audit Trail Completeness. Case Data Model Integrity. Notification Delivery Success. Routing Engine Latency. Open Case Detection Accuracy.\\n\\nThe four categories together prove the architecture is delivering — customer outcomes, operational efficiency, AI quality, and technical soundness.\\n\\nYEAR-BY-YEAR SUCCESS\\n\\nThe metrics that matter shift by year because the architecture matures by year.\\n\\nYear 1 success — the bridge is in production, pilot scope is running, customers are no longer re-explaining. Repeat contact rate in pilot below baseline. Customer-initiated status inquiries near zero. SLA adherence above baseline. Zero duplicate cases for the same customer and issue. Context continuity at 100%.\\n\\nYear 2 success — Resolution Agent is live in low-risk cohorts, Mid-Market has adopted, customer trust is maintained. AI resolution success rate meeting target in approved scope. AI resolution reversal rate below threshold. CSAT for AI-resolved cases comparable to or better than human-resolved. Mid-Market adoption with named relationships preserved. Cross-product cases successfully handled.\\n\\nYear 3 success — AI Learning Engine is live, predictive intervention is working, Services has adopted. Year 3 routing accuracy measurably better than Year 1. Year 3 FCR measurably higher than Year 1. Year 3 repeat contact rate measurably lower than Year 1. Proactive intervention rate significant. Services adoption with bookkeeper relationships preserved. Permanent exclusions still honored.\\n\\nTHREE METRICS THAT TELL THE TRUTH\\n\\nIf I could only watch three metrics, I would watch these.\\n\\nFirst — Customer-Initiated Status Inquiries. Target near zero. This is the metric that proves single-threaded ownership is real. Every time a customer reaches out to ask \\\"what is happening with my case,\\\" it means the proactive comms engine missed a state change or the customer did not trust the system to keep them informed. Near zero is not a vanity metric — it is the architectural proof.\\n\\nSecond — Repeat Contact Rate. Direction down. This measures whether resolution actually resolved. Closure does not mean resolved. If customers come back, the architecture is hiding the problem rather than solving it.\\n\\nThird — AI Resolution Reversal Rate. Direction down, critical. This measures whether AI is earning customer trust. Rising reversal rate is the early warning signal to pull back AI scope. We watch this metric carefully because trust in financial AI is lost in buckets and regained in spoonfuls.\\n\\nTHREE ANTI-METRICS — WHAT NOT TO OPTIMIZE FOR\\n\\nThree metrics that look like success but quietly destroy the system if you optimize for them.\\n\\nAI Deflection Rate as primary metric. This creates pressure to push AI to handle cases it should not. Optimize for resolution quality, not deflection volume.\\n\\nAverage Handle Time alone. Pressuring experts to close faster trades quality for speed. Track AHT but pressure on FCR and CSAT instead.\\n\\nCustomer Self-Serve Rate as primary metric. Looks good but may mean customers failed to reach a human. Self-serve emerges from making humans available, not from blocking access.\\n\\nTHE BOTTOM LINE\\n\\nSuccess is not measured by how many cases AI resolved. Success is measured by whether customers got resolution without effort, whether single-threaded ownership held, and whether AI earned customer trust.\\n\\nThat is the architectural commitment. Now let me close with the defensible position.\"\n]\n<\u002Fscript>\n<style>\n  :root {\n    /* Intuit-inspired palette — original design */\n    --ink: #0A2540;\n    --ink-dim: rgba(10, 37, 64, 0.66);\n    --ink-faint: rgba(10, 37, 64, 0.38);\n    --bg: #FFFFFF;\n    --bg-deep: #F5F7FA;\n    --accent: #0077C5;        /* Intuit blue */\n    --accent-deep: #0A2540;   /* deep navy */\n    --accent-warm: #FFB200;   /* QuickBooks-style amber for spark */\n    --rule: rgba(10, 37, 64, 0.14);\n  }\n\n  html, body {\n    margin: 0;\n    padding: 0;\n    background: #000;\n    font-family: 'Inter', system-ui, sans-serif;\n    color: var(--ink);\n    -webkit-font-smoothing: antialiased;\n  }\n\n  deck-stage section {\n    background: v  margin-left: 10px;\n  }\n\n  /* HERO */\n  .s1-hero {\n    display: flex;\n    flex-direction: column;\n    gap: 56px;\n    margin-top: 40px;\n  }\n\n  .s1-eyebrow {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 20px;\n    font-weight: 400;\n    color: var(--accent);\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    display: flex;\n    align-items: center;\n    gap: 18px;\n  }\n\n  .s1-eyebrow .num {\n    color: var(--ink-faint);\n    font-weight: 300;\n  }\n\n  .s1-eyebrow .rule {\n    flex: 0 0 80px;\n    height: 1px;\n    background: var(--accent);\n    opacity: 0.7;\n  }\n\n  .s1-title {\n    font-family: 'Fraunces', serif;\n    font-weight: 400;\n    font-size: 124px;\n    line-height: 0.98;\n    letter-spacing: -0.025em;\n    margin: 0;\n    max-width: 1500px;\n    text-wrap: balance;\n    font-variation-settings: \"opsz\" 144;\n  }\n\n  .s1-title .accent {\n    font-style: italic;\n    font-weight: 400;\n    color: var(--accent);\n    background: linear-gradient(180deg, #0077C5 0%, #0A2540 100%);\n    -webkit-background-clip: text;\n    background-clip: text;\n    -webkit-text-fill-color: transparent;\n  }\n\n  .s1-subtitle {\n    font-family: 'Inter', sans-serif;\n    font-size: 36px;\n    font-weight: 300;\n    color: var(--ink-dim);\n    line-height: 1.3;\n    letter-spacing: -0.005em;\n    max-width: 1200px;\n    margin: 0;\n  }\n\n  .s1-subtitle .pipe {\n    color: var(--accent);\n    margin: 0 18px;\n    font-weight: 400;\n  }\n\n  /* DIVIDER + META */\n  .s1-meta {\n    display: grid;\n    grid-template-columns: 1fr 1fr 1fr auto;\n    gap: 60px;\n    align-items: end;\n    padding-top: 36px;\n    border-top: 1px solid var(--rule);\n  }\n\n  .s1-meta .label {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 14px;\n    font-weight: 400;\n    color: var(--ink-faint);\n    letter-spacing: 0.16em;\n    text-transform: uppercase;\n    margin-bottom: 16px;\n  }\n\n  .s1-meta .value {\n    font-family: 'Inter', sans-serif;\n    font-size: 26px;\n    font-weight: 500;\n    color: var(--ink);\n    line-height: 1.25;\n    letter-spacing: -0.01em;\n  }\n\n  .s1-meta .value .sub {\n    display: block;\n    font-weight: 300;\n    color: var(--ink-dim);\n    font-size: 22px;\n    margin-top: 4px;\n    letter-spacing: 0;\n  }\n\n  .s1-meta .date-block {\n    text-align: right;\n  }\n\n  .s1-meta .date-block .value {\n    font-family: 'Fraunces', serif;\n    font-weight: 300;\n    font-size: 44px;\n    font-variation-settings: \"opsz\" 144;\n    white-space: nowrap;\n  }\n\n  /* Decorative right-side architecture mark */\n  .s1-mark {\n    position: absolute;\n    top: 200px;\n    right: 80px;\n    width: 320px;\n    height: 320px;\n    pointer-events: none;\n    opacity: 0.85;\n  }\n\n  .s1-mark svg {\n    width: 100%;\n    height: 100%;\n  }\n\n  /* ============== SLIDE 2: FROM → TO ============== */\n  .s2 {\n    position: relative;\n    background: #FFFFFF;\n  }\n\n  .s2-bar {\n    position: absolute;\n    left: 0;\n    top: 0;\n    bottom: 0;\n    width: 14px;\n    background: linear-gradient(180deg, #0077C5 0%, #0A2540 100%);\n  }\n\n  .s2-frame {\n    position: absolute;\n    inset: 60px 80px 60px 110px;\n    display: flex;\n    flex-direction: column;\n    gap: 0;\n  }\n\n  /* Header */\n  .s2-eyebrow {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 20px;\n    font-weight: 400;\n    color: var(--accent);\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    display: flex;\n    align-items: center;\n    gap: 18px;\n  }\n\n  .s2-eyebrow .num {\n    color: var(--ink-faint);\n    font-weight: 300;\n  }\n\n  .s2-eyebrow .rule {\n    flex: 0 0 80px;\n    height: 1px;\n    background: var(--accent);\n    opacity: 0.7;\n  }\n\n  .s2-title {\n    font-family: 'Fraunces', serif;\n    font-weight: 400;\n    font-size: 76px;\n    line-height: 1.02;\n    letter-spacing: -0.02em;\n    color: var(--ink);\n    margin: 28px 0 0 0;\n    max-width: 1500px;\n    text-wrap: balance;\n    font-variation-settings: \"opsz\" 144;\n  }\n\n  .s2-title .accent {\n    font-style: italic;\n    background: linear-gradient(180deg, #0077C5 0%, #0A2540 100%);\n    -webkit-background-clip: text;\n    background-clip: text;\n    -webkit-text-fill-color: transparent;\n  }\n\n  .s2-subtitle {\n    font-family: 'Inter', sans-serif;\n    font-size: 28px;\n    font-weight: 400;\n    color: var(--ink-dim);\n    margin: 18px 0 0 0;\n    letter-spacing: -0.005em;\n  }\n\n  /* FROM → TO grid */\n  .s2-grid {\n    display: grid;\n    grid-template-columns: 1fr 64px 1fr;\n    gap: 0;\n    margin-top: 56px;\n  }\n\n  .s2-col {\n    padding: 36px 0 32px 0;\n  }\n\n  .s2-col .tag {\n    display: inline-flex;\n    align-items: center;\n    gap: 12px;\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 18px;\n    font-weight: 500;\n    letter-spacing: 0.2em;\n    text-transform: uppercase;\n    padding: 8px 16px;\n    border-radius: 4px;\n    margin-bottom: 32px;\n  }\n\n  .s2-col.from .tag {\n    color: var(--ink-faint);\n    background: rgba(10, 37, 64, 0.05);\n  }\n\n  .s2-col.to .tag {\n    color: #FFFFFF;\n    background: #0A2540;\n  }\n\n  .s2-col.to .tag .dot {\n    width: 6px;\n    height: 6px;\n    border-radius: 50%;\n    background: #FFB200;\n  }\n\n  .s2-col ul {\n    list-style: none;\n    padding: 0;\n    margin: 0;\n    display: flex;\n    flex-direction: column;\n    gap: 22px;\n  }\n\n  .s2-col li {\n    font-family: 'Inter', sans-serif;\n    font-size: 28px;\n    line-height: 1.35;\n    letter-spacing: -0.01em;\n    padding-left: 28px;\n    position: relative;\n  }\n\n  .s2-col.from li {\n    color: rgba(10, 37, 64, 0.55);\n    font-weight: 400;\n    text-decoration: line-through;\n    text-decoration-color: rgba(10, 37, 64, 0.22);\n    text-decoration-thickness: 1px;\n  }\n\n  .s2-col.from li::before {\n    content: \"—\";\n    position: absolute;\n    left: 0;\n    top: 0;\n    color: rgba(10, 37, 64, 0.3);\n    text-decoration: g-top: 20px;\n  }\n  .s3-row.first-of-cat .cell.cat {\n    padding-top: 24px;\n  }\n\n  .s3-row.last-of-cat .cell {\n    padding-bottom: 20px;\n  }\n\n  .s3-footer {\n    margin-top: 24px;\n    background: linear-gradient(135deg, #0A2540 0%, #0077C5 100%);\n    color: #FFFFFF;\n    padding: 22px 36px;\n    border-radius: 4px;\n    display: grid;\n    grid-template-columns: auto 1fr;\n    gap: 28px;\n    align-items: center;\n  }\n\n  .s3-footer .label {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 14px;\n    font-weight: 500;\n    letter-spacing: 0.22em;\n    text-transform: uppercase;\n    color: #FFB200;\n    white-space: nowrap;\n    border-right: 1px solid rgba(255,255,255,0.22);\n    padding-right: 32px;\n  }\n\n  .s3-footer .body {\n    font-family: 'Inter', sans-serif;\n    font-size: 22px;\n    line-height: 1.4;\n    font-weight: 400;\n  }\n\n  .s3-footer .body strong {\n    font-weight: 600;\n    color: #FFB200;\n  }\n\n  /* ============== SLIDE 4: CUSTOMER JOURNEY — VERTICAL TIMELINE ============== */\n  .s4 { position: relative; background: #FFFFFF; }\n\n  .s4-bar {\n    position: absolute; left: 0; top: 0; bottom: 0;\n    width: 14px;\n    background: linear-gradient(180deg, #0077C5 0%, #0A2540 100%);\n  }\n\n  .s4-frame {\n    position: absolute;\n    inset: 44px 60px 44px 90px;\n    display: flex;\n    flex-direction: column;\n  }\n\n  .s4-head {\n    display: flex;\n    justify-content: space-between;\n    align-items: flex-end;\n    gap: 40px;\n  }\n\n  .s4-eyebrow {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 17px;\n    color: var(--accent);\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    display: flex; align-items: center; gap: 14px;\n  }\n  .s4-eyebrow .num { color: var(--ink-faint); font-weight: 300; }\n  .s4-eyebrow .rule { flex: 0 0 56px; height: 1px; background: var(--accent); opacity: 0.7; }\n\n  .s4-title {\n    font-family: 'Fraunces', serif;\n    font-weight: 400;\n    font-size: 48px;\n    line-height: 1.04;\n    letter-spacing: -0.02em;\n    color: var(--ink);\n    margin: 10px 0 0 0;\n    font-variation-settings: \"opsz\" 144;\n  }\n  .s4-title .accent {\n    font-style: italic;\n    background: linear-gradient(180deg, #0077C5 0%, #0A2540 100%);\n    -webkit-background-clip: text; background-clip: text;\n    -webkit-text-fill-color: transparent;\n  }\n\n  .s4-subtitle {\n    font-family: 'Inter', sans-serif;\n    font-size: 19px;\n    color: var(--ink-dim);\n    margin: 6px 0 0 0;\n  }\n\n  .s4-legend {\n    display: flex; gap: 20px; flex-wrap: wrap; align-items: center;\n  }\n  .s4-legend .leg {\n    display: flex; align-items: center; gap: 8px;\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 12px; letter-spacing: 0.16em;\n    text-transform: uppercase; color: var(--ink-dim);\n  }\n  .s4-legend .swatch { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid; }\n  .s4-legend .swatch.ai { background: #FFF6E0; border-color: #FFB200; }\n  .s4-legend .swatch.sys { background: #F1F4F8; border-color: rgba(10,37,64,0.45); }\n  .s4-legend .swatch.over { background: #FDEFEE; border-color: #C8392E; }\n  .s4-legend .swatch.human { background: #EDF5FC; border-color: #0077C5; }\n\n  /* Two-column timeline */\n  .s4-timeline {\n    margin-top: 18px;\n    flex: 1;\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    column-gap: 36px;\n    position: relative;\n  }\n\n  /* Override bypass — SVG dashed connector spanning the timeline.\n     viewBox 1000x1000, preserveAspectRatio=none stretches to fit timeline exactly.\n     Path drawn in viewBox units: starts at override card right edge (x=500),\n     mid override row (y≈480), goes up to mid human-routing row (y≈90),\n     turns right into the human routing card area (x=580). */\n  .s4-bypass {\n    position: absolute;\n    inset: 0;\n    width: 100%;\n    height: 100%;\n    overflow: visible;\n    pointer-events: none;\n    z-index: 4;\n  }\n  .s4-bypass-tag {\n    position: absolute;\n    /* Sits along the vertical spine of the bypass (~50% across, mid-height) */\n    left: 50%;\n    top: 28%;\n    transform: translateX(-50%);\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 10px;\n    letter-spacing: 0.16em;\n    text-transform: uppercase;\n    color: #C8392E;\n    background: #FFFFFF;\n    padding: 2px 8px;\n    border-radius: 2px;\n    border: 1px solid rgba(200,57,46,0.4);\n    z-index: 5;\n    white-space: nowrap;\n  }\n\n  .s4-col { display: flex; flex-direction: column; }\n\n  /* A single step row */\n  .s4-step {\n    display: grid;\n    grid-template-columns: 124px 28px 1fr;\n    align-items: stretch;\n    gap: 0;\n  }\n\n  .s4-step .label {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 11px;\n    color: var(--ink-faint);\n    letter-spacing: 0.14em;\n    text-transform: uppercase;\n    text-align: right;\n    padding: 14px 12px 0 0;\n    line-height: 1.3;\n  }\n\n  .s4-step .rail {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n  }\n  .s4-step .dot {\n    width: 14px; height: 14px; border-radius: 50%;\n    margin-top: 14px;\n    border: 2px solid;\n    flex-shrink: 0;\n  }\n  .s4-step .vline {\n    width: 1px; flex: 1;\n    background: rgba(10,37,64,0.18);\n    margin-top: 4px;\n  }\n  .s4-step:last-child .vline { display: none; }\n\n  .s4-step .body {\n    padding: 6px 0 14px 14px;\n  }\n\n  .s4-card {\n    border-radius: 6px;\n    padding: 9px 12px;\n    border: 1px solid;\n    display: flex;\n    flex-direction: column;\n    gap: 1px;\n  }\n  .s4-card h4 {\n    margin: 0;\n    font-family: 'Inter', sans-serif;\n    font-size: 14px;\n    font-weight: 600;\n    line-height: 1.22;\n    letter-spacing: -0.005em;\n    color: var(--ink);\n  }\n  .s4-card p {\n    margin: 1px 0 0 0;\n    font-family: 'Inter', sans-serif;\n    font-size: 12px;\n    line-height: 1.32;\n    color: var(--ink-dim);\n  }\n\n  .s4-step.ai .dot { background: #FFF6E0; border-color: #FFB200; }\n ercase;\n    color: var(--accent);\n    margin-bottom: 4px;\n    padding: 3px 8px;\n    background: rgba(0,119,197,0.08);\n    border-left: 2px solid var(--accent);\n    display: inline-block;\n    border-radius: 2px;\n  }\n\n  /* VEP split card — AI assist sub-block */\n  .s4-card-split .ai-assist {\n    margin-top: 8px;\n    padding: 6px 10px;\n    background: #FFFAEC;\n    border: 1px solid rgba(255,178,0,0.5);\n    border-radius: 4px;\n  }\n  .s4-card-split .ai-assist .ai-assist-tag {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 10px;\n    letter-spacing: 0.14em;\n    text-transform: uppercase;\n    color: #B8821B;\n    margin-bottom: 2px;\n  }\n  .s4-card-split .ai-assist p {\n    margin: 0;\n    font-size: 12px;\n    line-height: 1.32;\n    color: var(--ink);\n  }\n\n  /* Bottom-line footer */\n  .s4-footer {\n    margin-top: 12px;\n    background: linear-gradient(135deg, #0A2540 0%, #0077C5 100%);\n    color: #FFFFFF;\n    padding: 14px 28px;\n    border-radius: 4px;\n    display: grid;\n    grid-template-columns: auto 1fr;\n    gap: 24px;\n    align-items: center;\n  }\n  .s4-footer .label-tag {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 12px;\n    letter-spacing: 0.22em;\n    text-transform: uppercase;\n    color: #FFB200;\n    white-space: nowrap;\n    border-right: 1px solid rgba(255,255,255,0.22);\n    padding-right: 24px;\n  }\n  .s4-footer .body-text {\n    font-family: 'Inter', sans-serif;\n    font-size: 17px;\n    line-height: 1.4;\n  }\n  .s4-footer .body-text strong { color: #FFB200; font-weight: 600; }\n\n  /* ============== SLIDE 5: TARGET STATE ARCHITECTURE — LAYERED STACK ============== */\n  .s5 { position: relative; background: #FFFFFF; }\n\n  /* Color tokens */\n  .s5 {\n    --c-cust-bg: #EAE6F4;\n    --c-cust-bd: #B4A8DD;\n    --c-cust-tx: #4A3580;\n    --c-ai-bg: #FFE5C2;\n    --c-ai-bd: #F2A24E;\n    --c-ai-tx: #8A4A0F;\n    --c-sys-bg: #DCEBFB;\n    --c-sys-bd: #5C9CDF;\n    --c-sys-tx: #14517A;\n lign-items: center; gap: 6px;\n    font-family: 'Inter', sans-serif;\n    font-size: 11px; font-weight: 500;\n    color: var(--ink);\n  }\n  .s5-legend-row .sw { width: 12px; height: 12px; border-radius: 2px; border: 1px solid; }\n  .s5-legend-row .sw.cust { background: var(--c-cust-bg); border-color: var(--c-cust-bd); }\n  .s5-legend-row .sw.ai { background: var(--c-ai-bg); border-color: var(--c-ai-bd); }\n  .s5-legend-row .sw.sys { background: var(--c-sys-bg); border-color: var(--c-sys-bd); }\n  .s5-legend-row .sw.vep { background: var(--c-vep-bg); border-color: var(--c-vep-bd); }\n  .s5-legend-row .sw.sec { background: var(--c-sec-bg); border-color: var(--c-sec-bd); }\n  .s5-legend-row .leg.existing .sw { background: #FFFFFF; border: 1.5px dashed #94A3B8; }\n  .s5-legend-row .leg.new .sw { background: #FFE7B5; border: 1.5px solid #FFB200; }\n  .s5-legend-row .leg.flow1 .arrow { width: 22px; height: 0; border-top: 2px solid var(--flow1); position: relative; }\n  .s5-legend-row .leg.flow1 .arrow::after {\n    content: ''; position: absolute; right: -1px; top: -4px;\n    border-left: 6px solid var(--flow1); border-top: 4px solid transparent; border-bottom: 4px solid transparent;\n  }\n  .s5-legend-row .leg.flow2 .arrow { width: 22px; height: 0; border-top: 2px solid var(--flow2); position: relative; }\n  .s5-legend-row .leg.flow2 .arrow::after {\n    content: ''; position: absolute; right: -1px; top: -4px;\n    border-left: 6px solid var(--flow2); border-top: 4px solid transparent; border-bottom: 4px solid transparent;\n  }\n\n  /* Body grid: stack column + right rail */\n  .s5-body {\n    flex: 1;\n    display: grid;\n    grid-template-columns: 1fr 230px;\n    gap: 10px;\n    position: relative;\n    min-height: 0;\n  }\n\n  .s5-stackcol {\n    display: flex;\n    flex-direction: column;\n    gap: 6px;\n    position: relative;\n  }\n\n  /* GenSRF wrapper band (top) */\n  .s5-wrap {\n    border: 1.5px solid var(--c-sec-bd);\n    background: var(--c-sec-bg);\n    border-radius: 4px;\n    padding: 6px 12px;\n    display: grid;\n    grid-template-columns: 110px 1fr auto;\n    gap: 14px;\n    align-items: center;\n    position: relative;\n  }\n  .s5-wrap.ai-wrap { border-color: var(--c-ai-bd); background: var(--c-ai-bg); }\n  .s5-wrap .wrap-label {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;\n    font-weight: 700;\n  }\n  .s5-wrap.sec-wrap .wrap-label { color: var(--c-sec-tx); }\n  .s5-wrap.ai-wrap .wrap-label { color: var(--c-ai-tx); }\n  .s5-wrap .wrap-body {\n    font-family: 'Inter', sans-serif;\n    font-size: 11px;\n    line-height: 1.35;\n    color: var(--ink);\n  }\n  .s5-wrap .wrap-body strong { font-weight: 600; }\n  .s5-wrap .wrap-tag {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;\n    padding: 2px 6px; border-radius: 2px;\n    font-weight: 600;\n  }\n  .s5-wrap.sec-wrap .wrap-tag { background: rgba(255,255,255,0.55); color: var(--c-sec-tx); border: 1px solid var(--c-sec-bd); }\n  .s5-wrap.ai-wrap .wrap-tag { background: rgba(255,255,255,0.55); color: var(--c-ai-tx); border: 1px solid var(--c-ai-bd); }\n\n  /* The 8 inner layers (L1-L5, L7-L9) — actual stack body */\n  .s5-stack {\n    flex: 1;\n    display: grid;\n    grid-template-rows: repeat(8, 1fr);\n    gap: 4px;\n    position: relative;\n    padding: 0 28px; /* gutter for flow arrows */\n  }\n\n  /* Layer card */\n  .s5-layer {\n    display: grid;\n    grid-template-columns: 130px 1fr auto;\n    gap: 12px;\n    align-items: center;\n    border-radius: 4px;\n    padding: 5px 12px;\n    border: 1px solid;\n    position: relative;\n    min-height: 0;\n  }\n  .s5-layer.existing {\n    background: #FFFFFF;\n    border: 1.5px dashed rgba(10,37,64,0.30);\n  }\n  .s5-layer.new {\n    background: #FFFAEB;\n    border: 1.5px solid #FFB200;\n    box-shadow: 0 0 0 3px rgba(255,178,0,0.10);\n  }\n\n  .s5-layer .lname {\n    display: flex; flex-direction: column; gap: 1px;\n    border-right: 1px solid rgba(10,37,64,0.10);\n    padding-right: 10px;\n  }\n  .s5-layer .lname .num {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 10px; letter-spacing: 0.14em; color: var(--ink-faint);\n    font-weight: 500;\n  }\n  .s5-layer .lname .nm {\n    font-family: 'Inter', sans-serif;\n    font-size: 14px; font-weight: 600;\n    color: var(--ink); letter-spacing: -0.005em;\n    line-height: 1.1;\n  }\n  .s5-layer .lname .desc {\n    font-family: 'Inter', sans-serif;\n    font-size: 9.5px; color: var(--ink-dim);\n    line-height: 1.25; margin-top: 1px;\n  }\n\n  .s5-layer .lcomp {\n    display: flex; gap: 4px; flex-wrap: wrap; align-items: center;\n  }\n  .s5-layer .pill {\n    border: 1px solid;\n    border-radius: 3px;\n    padding: 2px 6px;\n    font-family: 'Inter', sans-serif;\n    font-size: 10px; font-weight: 500;\n    line-height: 1.2;\n    white-space: nowrap;\n  }\n  .s5-layer .pill.cust { background: var(--c-cust-bg); border-color: var(--c-cust-bd); color: var(--c-cust-tx); }\n  .s5-layer .pill.ai { background: var(--c-ai-bg); border-color: var(--c-ai-bd); color: var(--c-ai-tx); }\n  .s5-layer .pill.sys { background: var(--c-sys-bg); border-color: var(--c-sys-bd); color: var(--c-sys-tx); }\n  .s5-layer .pill.vep { background: var(--c-vep-bg); border-color: var(--c-vep-bd); color: var(--c-vep-tx); }\n  .s5-layer .pill.sec { background: var(--c-sec-bg); border-color: var(--c-sec-bd); color: var(--c-sec-tx); }\n  .s5-layer .pill .tiny {\n    font-size: 8.5px; opacity: 0.75; font-weight: 400; margin-left: 4px;\n  }\n\n  .s5-layer .lprin {\n    font-family: 'Inter', sans-serif;\n    font-size: 9.5px;\n    color: var(--ink-dim);\n    line-height: 1.3;\n    max-width: 260px;\n    text-align: right;\n    border-left: 1px solid rgba(10,37,64,0.10);\n    padding-left: 10px;\n  }\n  .s5-layer .lprin strong { color: var(--ink); font-weight: 600; }\n\n  .s5-layer .ntag {\n    position: absolute;\n    top: -7px; right: 10px;\n    background: #FFB200;\n    color: #0A2540;\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 8px; font-weight: 700;\n    letter-spacing: 0.14em;\n    padding: 1px 6px;\n    border-radius: 2px;\n  }\n  .s5-layer .etag {\n    position: absolute;\n    top: -7px; right: 10px;\n    background: #FFFFFF;\n    color: var(--ink-faint);\n    border: 1px solid rgba(10,37,64,0.20);\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 8px; font-weight: 500;\n    letter-spacing: 0.14em;\n    padding: 1px 6px;\n    border-radius: 2px;\n  }\n\n  /* Right rail: L10 Notifications */\n  .s5-rail {\n    border: 1.5px solid #FFB200;\n    background: #FFFAEB;\n    box-shadow: 0 0 0 3px rgba(255,178,0,0.10);\n    border-radius: 4px;\n    padding: 12px 14px;\n    display: flex;\n    flex-direction: column;\n    gap: 8px;\n    position: relative;\n  }\n  .s5-rail .rail-tag {\n    position: absolute;\n    top: -7px; right: 12px;\n    background: #FFB200;\n    color: #0A2540;\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 8px; font-weight: 700;\n    letter-spacing: 0.14em;\n    padding: 1px 6px;\n    border-radius: 2px;\n  }\n  .s5-rail .rail-num {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 10px; letter-spacing: 0.14em; color: var(--ink-faint);\n    font-weight: 500;\n  }\n  .s5-rail .rail-name {\n    font-family: 'Inter', sans-serif;\n    font-size: 14px; font-weight: 600;\n    color: var(--ink); letter-spacing: -0.005em;\n    line-height: 1.1;\n  }\n  .s5-rail .rail-desc {\n    font-family: 'Inter', sans-serif;\n    font-size: 10px; color: var(--ink-dim);\n    line-height: 1.35;\n  }\n  .s5-rail .rail-states {\n    display: flex; flex-direction: column; gap: 3px;\n    margin-top: 2px;\n  }\n  .s5-rail .rail-state {\n    display: flex; align-items: center; gap: 6px;\n    font-family: 'Inter', sans-serif;\n    font-size: 10px;\n    color: var(--ink);\n  }\n  .s5-rail .rail-state .dot {\n    width: 5 5r-card--human    { border-color: #E8B98A; background: #FFF8EC; }\n\n  .s5r-card-tag {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 8.5px; font-weight: 700;\n    letter-spacing: 0.06em;\n    color: var(--ink-dim);\n  }\n  .s5r-card--customer .s5r-card-tag { color: #8B6914; }\n  .s5r-card--ai .s5r-card-tag       { color: #0077C5; }\n  .s5r-card--human .s5r-card-tag    { color: #B45A1A; }\n\n  .s5r-card-head {\n    font-size: 11.5px; font-weight: 600;\n    color: var(--ink); line-height: 1.2;\n  }\n  .s5r-card-body {\n    font-size: 10px; color: var(--ink-dim);\n    line-height: 1.35;\n  }\n  .s5r-card-quote {\n    font-family: 'Fraunces', serif;\n    font-style: italic;\n    font-size: 10px;\n    color: #003B6F;\n    line-height: 1.3;\n    border-left: 2px solid #FFB200;\n    padding-left: 6px;\n    margin-top: 2px;\n  }\n  .s5r-card-out {\n    display: flex; gap: 4px; flex-wrap: wrap; margin-top: auto;\n    padding-top: 3px;\n  }\n  .s5r-out {\n    display: inline-block;\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 8.5px; font-weight: 700;\n    padding: 2px 5px;\n    border-radius: 3px;\n    letter-spacing: 0.04em;\n  }\n  .s5r-out--ok   { background: #E0F2E5; color: #1F7A3F; border: 1px solid #A8D5B5; }\n  .s5r-out--fail { background: #FCE8E1; color: #B23A1A; border: 1px solid #E8B59A; }\n\n  /* Decision diamond */\n  .s5r-cell--diamond {\n    display: flex; align-items: center; justify-content: center;\n    position: relative;\n  }\n  .s5r-diamond {\n    position: relative;\n    width: 100%; height: 100%;\n    display: flex; align-items: center; justify-content: center;\n  }\n  .s5r-diamond-inner {\n    width: 86px; height: 86px;\n    transform: rotate(45deg);\n    background: linear-gradient(135deg, #FFB200 0%, #E27D2C 100%);\n    border-radius: 6px;\n    display: flex; align-items: center; justify-content: center;\n    box-shadow: 0 2px 6px rgba(226,125,44,0.25);\n  }\n  .s5r-diamond-q {\n    transform: rotate(-45deg);\n    font-family: 'Fraunces', serif;\n    font-size: 11px; font-weight: 600;\n    color: #FFFFFF; text-align: center;\n    line-height: 1.1;\n  }\n  .s5r-diamond-yes, .s5r-diamond-no {\n    position: absolute;\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 8px; font-weight: 700;\n    letter-spacing: 0.05em;\n    padding: 1px 4px;\n    border-radius: 2px;\n  }\n  .s5r-diamond-yes {\n    top: 4px; right: 2px;\n    background: #E0F2E5; color: #1F7A3F;\n  }\n  .s5r-diamond-no {\n    bottom: 4px; left: 2px;\n    background: #FCE8E1; color: #B23A1A;\n  }\n\n  /* Team pills (case mgmt) */\n  .s5r-team {\n    display: flex; gap: 3px; flex-wrap: wrap; margin-top: 3px;\n  }\n  .s5r-team-pill {\n    display: inline-block;\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 8.5px; font-weight: 700;\n    padding: 2px 5px;\n    border-radius: 3px;\n    background: #FFFFFF;\n    border: 1px solid #E8B98A;\n    color: #B45A1A;\n    letter-spacing: 0.05em;\n  }\n  .s5r-team-pill--owner {\n    background: #FFB200; color: #FFFFFF; border-color: #E89F00;\n  }\n  .s5r-team-pill--more {\n    background: transparent; border-style: dashed;\n    color: var(--ink-dim);\n  }\n\n  /* Bottom callout */\n  .s5r-callout {\n    background: linear-gradient(90deg, #0A2540 0%, #003B6F 100%);\n    color: #FFFFFF;\n    padding: 11px 22px;\n    border-radius: 8px;\n    display: flex;\n    align-items: center;\n    gap: 18px;\n  }\n  .s5r-callout-label {\n    flex: 0 0 auto;\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 10.5px; font-weight: 700;\n    color: #FFB200; letter-spacing: 0.16em;\n    border-right: 1px solid rgba(255,255,255,0.25);\n    padding-right: 18px;\n  }\n  .s5r-callout-body {\n    font-size: 12.5px;\n    line-height: 1.45;\n    color: rgba(255,255,255,0.9);\n  }\n  .s5r-callout-body em {\n    font-style: italic; color: #FFB200; font-weight: 500;\n  }\n  .s5r-callout-body strong {\n    color: #FFFFFF; font-weight: 600;\n  }\n\n  /* ============================================================\n     SLIDE 09 — TECHNICAL ARCHITECTURE\n     Three zones · four integration patterns · two cross-cuttings\n     ============================================================ */\n  .s9 {\n    position: relative;\n    background: #FAFBFC;\n    color: var(--ink);\n    overflow: hidden;\n    font-family: 'Inter', sans-serif;\n  }\n  .s9-bar {\n    position: absolute; left: 0; top: 0; bottom: 0;\n    width: 14px;\n    background: linear-gradient(180deg, #0077C5 0%, #FFB200 50%, #E27D2C 100%);\n    z-index: 2;\n  }\n  .s9-frame {\n    position: absolute;\n    inset: 0;\n    padding: 24px 36px 18px 48px;\n    display: grid;\n    grid-template-rows: auto 1fr auto;\n    gap: 12px;\n  }\n\n  /* Header */\n  .s9-eyebrow {\n    display: flex; align-items: center; gap: 14px;\n    margin-bottom: 6px;\n  }\n  .s9-num {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 13px; font-weight: 700;\n    color: #FFB200; letter-spacing: 0.08em;\n  }\n  .s9-divider { flex: 0 0 24px; height: 1px; background: rgba(10,37,64,0.25); }\n  .s9-section {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 11px; font-weight: 600;\n    color: var(--ink-dim); letter-spacing: 0.18em;\n  }\n  .s9-headrow {\n    display: grid;\n    grid-template-columns: 1fr 470px;\n    gap: 28px;\n    align-items: end;\n  }\n  .s9-title {\n    font-family: 'Fraunces', serif;\n    font-size: 38px; font-weight: 400;\n    color: var(--ink); line-height: 1.06;\n    margin: 0 0 6px 0;\n    letter-spacing: -0.015em;\n  }\n  .s9-title .accent {\n    font-style: italic; font-weight: 400;\n    background: linear-gradient(135deg, #0077C5 0%, #003B6F 100%);\n    -webkit-background-clip: text; background-clip: text;\n    -webkit-text-fill-color: transparent;\n  }\n  .s9-subtitle {\n    font-size: 14px; line-height: 1.45; color: var(--ink-dim);\n    max-width: 1200px; margin: 0;\n  }\n  .s9-subtitle strong { color: var(--ink); font-weight: 600; }\n\n  /* Legend */\n  .s9-legend {\n    background: #FFFFFF;\n    border: 1px solid #E2E6EA;\n    border-radius: 8px;\n    padding: 10px 14px;\n  }\n  .s9-legend-title {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 9.5px; font-weight: 700;\n    letter-spacing: 0.18em; color: var(--ink-faint);\n    margin-bottom: 6px;\n    text-transform: uppercase;\n  }\n  .s9-legend-grid {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 4px 18px;\n  }\n  .s9-legend-row {\n    display: flex; align-items: center; gap: 8px;\n    font-family: 'Inter', sans-serif;\n    font-size: 10.5px;\n    color: var(--ink);\n    line-height: 1.2;\n  }\n  .s9-legend-row .glyph {\n    width: 28px; height: 12px;\n    flex: 0 0 28px;\n    display: flex; align-items: center;\n  }\n  .s9-legend-row .swatch {\n    width: 14px; height: 12px;\n    border-radius: 3px;\n    flex: 0 0 14px;\n  }\n  .s9-legend-row svg { width: 28px; height: 12px; display: block; }\n\n  /* Stage — the architecture grid */\n  .s9-stage {\n    position: relative;\n    background:\n      linear-gradient(180deg, #FFFFFF 0%, #F7F9FB 100%);\n    border: 1px solid #E2E6EA;\n    border-radius: 10px;\n    padding: 14px;\n    min-height: 0;\n    overflow: hidden;\n    display: flex;\n  }\n  .s9-grid {\n    position: relative;\n    width: 100%;\n    flex: 1;\n    display: grid;\n    grid-template-columns: 110px 1fr 130px;\n    gap: 10px;\n    min-height: 0;\n  }\n  .s9-zones {\n    grid-column: 2;\n    grid-row: 1;\n    display: grid;\n    grid-template-rows: minmax(115px, 0.8fr) minmax(135px, 1.0fr) minmax(135px, 1.0fr) minmax(80px, 0.55fr) minmax(85px, 0.65fr);\n    gap: 8px;\n    min-height: 0;\n  }\n\n  /* Zone bands */\n  .s9-zone {\n    position: relative;\n    border-radius: 8px;\n    padding: 10px 14px;\n    display: flex;\n    flex-direction: column;\n    gap: 6px;\n  }\n  .s9-zone--customer {\n    background: linear-gradient(180deg, #FFFEFB 0%, #FBF6E8 100%);\n    border: 1px solid #EFE2BA;\n  }\n  .s9-zone--decision {\n    background: linear-gradient(180deg, #F8FBFE 0%, #EDF4FB 100%);\n    border: 1px solid #CFE0EE;\n  }\n  .s9-zone--resolution {\n    background: linear-gradient(180deg, #FFFBF5 0%, #FBF1E0 100%);\n    border: 1px solid #ECD7B0;\n  }\n  .s9-zone--learning {\n    background: linear-gradient(180deg, #F4F2FB 0%, #ECE6F8 100%);\n    border: 1px solid #C9BEEC;\n  }\n  .s9-zone-head {\n    display: flex; justify-content: space-between; align-items: baseline;\n    padding-bottom: 4px;\n    border-bottom: 1px dashed rgba(10,37,64,0.16);\n  }\n  .s9-zone-tag {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 10px; font-weight: 700;\n    letter-spacing: 0.16em; color: var(--ink);\n    text-transform: uppercase;\n  }\n  .s9-zone-tag .label {\n    color: var(--ink);\n  }\n  .s9-zone-tag .id {\n    color: var(--ink-faint);\n    margin-right: 6px;\n  }\n  .s9-zone-meta {\n    font-family: 'Inter', sans-serif;\n    font-size: 10.5px;\n    color: var(--ink-dim);\n    font-style: italic;\n  }\n  .s9-zone-body {\n    flex: 1;\n    display: flex;\n    align-items: stretch;\n    gap: 8px;\n    min-height: 0;\n  }\n\n  /* Cross-cutting vertical bands (GenSRF, Notifications) */\n  .s9-band {\n    position: relative;\n    border-radius: 8px;\n    padding: 10px 8px 10px 8px;\n    display: flex;\n    flex-direction: column;\n    gap: 8px;\n    overflow: hidden;\n  }\n  .s9-band--gensrf {\n    background: linear-gradient(180deg, #FBEEEC 0%, #F2DAD6 100%);\n    border: 1px solid #D87C76;\n    grid-column: 1;\n    grid-row: 1;\n  }\n  .s9-band--notif {\n    background: linear-gradient(180deg, #F2EDFB 0%, #E5DBF6 100%);\n    border: 1px solid #9F8DD6;\n    grid-column: 3;\n    grid-row: 1;\n  }\n  .s9-band-head {\n    text-align: center;\n    padding-bottom: 6px;\n    border-bottom: 1px dashed rgba(10,37,64,0.16);\n  }\n  .s9-band-id {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 11px; font-weight: 700;\n    letter-spacing: 0.14em;\n    color: var(--ink);\n  }\n  .s9-band-name {\n    font-family: 'Inter', sans-serif;\n    font-size: 12px; font-weight: 600;\n    color: var(--ink);\n    margin-top: 2px;\n  }\n  .s9-band-rot {\n    flex: 1;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n  }\n  .s9-band-rot .text {\n    transform: rotate(-90deg);\n    white-space: nowrap;\n    font-family: 'Inter', sans-serif;\n    font-size: 10.5px;\n    color: var(--ink-dim);\n    line-height: 1.4;\n    text-align: center;\n  }\n  .s9-band-foot {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 8.5px; font-weight: 700;\n    letter-spacing: 0.1em;\n    color: var(--ink);\n    text-align: center;\n    padding-top: 6px;\n    border-top: 1px dashed rgba(10,37,64,0.16);\n    line-height: 1.5;\n    display: flex;\n    flex-direction: column;\n    gap: 2px;\n  }\n  .s9-band--gensrf .s9-band-foot { color: #8B3329; }\n  .s9-band--notif .s9-band-foot { color: #4A2D7A; }\n  .s9-band-foot .dot { display: none; }\n\n  /* Component box base */\n  .s9-box {\n    position: relative;\n    border-radius: 6px;\n    padding: 7px 10px;\n    display: flex;\n    flex-direction: column;\n    gap: 2px;\n    min-width: 0;\n  }\n  .s9-box--existing {\n    background: #FFF4D6;\n    border: 1px solid #E5C77A;\n  }\n  .s9-box--new {\n    background: #E1EFFB;\n    border: 1px solid #8FC0E5;\n  }\n  .s9-box--discovery {\n    background: #F2F4F7;\n    border: 1px dashed #B0BAC4;\n  }\n  .s9-box--xc {\n    background: #FBEEEC;\n    border: 1px solid #D87C76;\n  }\n  .s9-box-name {\n    font-family: 'Inter', sans-serif;\n    font-size: 12px; font-weight: 600;\n    color: var(--ink);\n    line-height: 1.15;\n    display: flex;\n    align-items: baseline;\n    gap: 6px;\n  }\n  .s9-box-name .lid {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 10px; font-weight: 700;\n    color: var(--ink-faint);\n    flex: 0 0 auto;\n  }\n  .s9-box-desc {\n    font-family: 'Inter', sans-serif;\n    font-size: 10.5px;\n    color: var(--ink-dim);\n    line-height: 1.3;\n  }\n  .s9-box-tag {\n    position: absolute;\n    top: -7px; right: 6px;\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 8px; font-weight: 700;\n    letter-spacing: 0.1em;\n    padding: 2px 5px;\n    border-radius: 2px;\n    text-transform: uppercase;\n  }\n  .s9-box-tag--ex { background: #FFF4D6; color: #8B6914; border: 1px solid #E5C77A; }\n  .s9-box-tag--new { background: #E1EFFB; color: #0077C5; border: 1px solid #8FC0E5; }\n  .s9-box-tag--disc { background: #F2F4F7; color: #5C6975; border: 1px dashed #B0BAC4; }\n\n  /* Zone 1 — channels */\n  .s9-channels {\n    flex: 1;\n    display: grid;\n    grid-template-columns: repeat(7, 1fr);\n    gap: 6px;\n    align-items: stretch;\n  }\n  .s9-channel {\n    background: #FFFFFF;\n    border: 1px solid #EFE2BA;\n    border-radius: 5px;\n    padding: 6px 4px 5px;\n    display: flex; flex-direction: column;\n    align-items: center; justify-content: flex-start;\n    gap: 4px;\n    text-align: center;\n  }\n  .s9-channel svg {\n    width: 22px; height: 22px;\n    stroke: #B68B1E; fill: none; stroke-width: 1.6;\n    stroke-linecap: round; stroke-linejoin: round;\n  }\n  .s9-channel .label {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 8.5px;\n    color: var(--ink);\n    letter-spacing: 0.06em;\n    text-transform: uppercase;\n    line-height: 1.15;\n  }\n  .s9-channels-block {\n    flex: 1;\n    display: flex;\n    flex-direction: column;\n    gap: 4px;\n    min-width: 0;\n  }\n  .s9-channels-foot {\n    font-family: 'Inter', sans-serif;\n    font-size: 10px;\n    color: var(--ink-dim);\n    font-style: italic;\n    text-align: center;\n  }\n  .s9-zone--customer .s9-zone-body {\n    align-items: stretch;\n  }\n  .s9-gateway {\n    flex: 0 0 200px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n  }\n  .s9-gateway .s9-box {\n    width: 100%;\n    text-align: left;\n  }\n\n  /* Zone 2 — decision */\n  .s9-decision {\n    flex: 1;\n    display: grid;\n    grid-template-columns: 1.4fr 1fr 1.4fr 1fr;\n    gap: 18px;\n    align-items: center;\n    min-height: 0;\n  }\n  .s9-arrow-h {\n    height: 100%;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    color: #475569;\n  }\n  .s9-arrow-h svg {\n    width: 12px; height: 12px;\n  }\n  .s9-arrow-h.skip {\n    color: #C44545;\n  }\n  .s9-norm {\n    background: #E1EFFB;\n    border: 1px solid #8FC0E5;\n    border-radius: 6px;\n    padding: 8px 10px;\n    display: flex;\n    flex-direction: column;\n    gap: 4px;\n    align-self: stretch;\n  }\n  .s9-norm-head {\n    font-family: 'Inter', sans-serif;\n    font-size: 12px; font-weight: 600;\n    color: var(--ink);\n    display: flex; align-items: baseline; gap: 6px;\n  }\n  .s9-norm-head .lid {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 10px; font-weight: 700;\n    color: #0077C5;\n  }\n  .s9-norm-chips {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: 3px 4px;\n  }\n  .s9-norm-chip {\n    background: #FFFFFF;\n    border: 1px solid #B7D4ED;\n    border-radius: 3px;\n    padding: 3px 4px;\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 8.5px;\n    color: var(--ink);\n    text-align: center;\n    line-height: 1.1;\n  }\n  .s9-diamond {\n    width: 84px; height: 84px;\n    background: #FFFFFF;\n    border: 1.5px solid #5C6975;\n    transform: rotate(45deg);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    margin: 0 auto;\n    border-radius: 4px;\n  }\n  .s9-diamond .text {\n    transform: rotate(-45deg);\n    font-family: 'Inter', sans-serif;\n    font-size: 10px;\n    color: var(--ink);\n    text-align: center;\n    line-height: 1.15;\n    width: 80px;\n    font-weight: 600;\n  }\n  .s9-resagent {\n    background: #FFF4D6;\n    border: 1px solid #E5C77A;\n    border-radius: 6px;\n    padding: 8px 10px;\n    display: flex;\n    flex-direction: column;\n    gap: 4px;\n    ali

"ent-name\" x=\"70\" y=\"92\">domain<\u002Ftext>\n              <text class=\"ent-type\" x=\"10\" y=\"106\">string<\u002Ftext>\n              <text class=\"ent-name\" x=\"70\" y=\"106\">status<\u002Ftext>\n              <text class=\"ent-type\" x=\"10\" y=\"120\">boolean<\u002Ftext>\n              <text class=\"ent-name\" x=\"70\" y=\"120\">component_resolved<\u002Ftext>\n              <text class=\"ent-type\" x=\"10\" y=\"134\">text<\u002Ftext>\n              <text class=\"ent-name\" x=\"70\" y=\"134\">handoff_notes<\u002Ftext>\n            <\u002Fg>\n\n            <!-- AI_RESOLUTION_LOG -->\n            <g class=\"erd-entity ent-ai\" transform=\"translate(1500,400)\" data-id=\"ai\" data-w=\"280\" data-h=\"184\">\n              <rect class=\"ent-body\" x=\"0\" y=\"24\" width=\"280\" height=\"160\" rx=\"2\"><\u002Frect>\n              <rect class=\"ent-header-bg\" x=\"0\" y=\"0\" width=\"280\" height=\"24\" rx=\"2\"><\u002Frect>\n              <text class=\"ent-title\" x=\"140\" y=\"16\" text-anchor=\"middle\">AI_RESOLUTION_LOG<\u002Ftext>\n              <text class=\"ent-type\" x=\"10\" y=\"36\">uuid<\u002Ftext>\n              <text class=\"ent-name\" x=\"70\" y=\"36\">log_id<\u002Ftext>\n              <text class=\"pk-badge\" x=\"270\" y=\"36\" text-anchor=\"end\">PK<\u002Ftext>\n              <text class=\"ent-type\" x=\"10\" y=\"50\">uuid<\u002Ftext>\n              <text class=\"ent-name\" x=\"70\" y=\"50\">case_id<\u002Ftext>\n              <text class=\"fk-badge\" x=\"270\" y=\"50\" text-anchor=\"end\">FK<\u002Ftext>\n              <text class=\"ent-type\" x=\"10\" y=\"64\">number<\u002Ftext>\n              <text class=\"ent-name\" x=\"70\" y=\"64\">attempt_number<\u002Ftext>\n              <text class=\"ent-type\" x=\"10\" y=\"78\">string<\u002Ftext>\n              <text class=\"ent-name\" x=\"70\" y=\"78\">agent_type<\u002Ftext>\n              <text class=\"ent-type\" x=\"10\" y=\"92\">text<\u002Ftext>\n              <text class=\"ent-name\" x=\"70\" y=\"92\">resolution_path_attempted<\u002Ftext>\n              <text class=\"ent-type\" x=\"10\" y=\"106\">text<\u002Ftext>\n              <text class=\"ent-name\" x=\"70\" y=\"106\">clarifying_question<\u002Ftext>\n              <text class=\"ent-type\" x=\"10\" y=\"120\">number<\u002Ftext>\n              <text class=\"ent-name\" x=\"70\" y=\"120\">confidence_score<\u002Ftext>\n              <text class=\"ent-type\" x=\"10\" y=\"134\">string<\u002Ftext>\n              <text class=\"ent-name\" x=\"70\" y=\"134\">outcome<\u002Ftext>\n              <text class=\"ent-type\" x=\"10\" y=\"148\">string<\u002Ftext>\n              <text class=\"ent-name\" x=\"70\" y=\"148\">failure_reason<\u002Ftext>\n              <text class=\"ent-type\" x=\"10\" y=\"162\">boolean<\u002Ftext>\n              <text class=\"ent-name\" x=\"70\" y=\"162\">escalation_triggered<\u002Ftext>\n              <text class=\"ent-type\" x=\"10\" y=\"176\">string<\u002Ftext>\n              <text class=\"ent-name\" x=\"70\" y=\"176\">expert_feedback<\u002Ftext>\n            <\u002Fg>\n\n          <\u002Fsvg>\n        <\u002Fdiv>\n\n        <!-- RIGHT: rules -->\n        <div class=\"s8-rules\">\n          <div class=\"s8-rules-header\">\n            <span class=\"rules-tag\">NON-NEGOTIABLE RULES<\u002Fspan>\n            <span class=\"rules-caption\">Enforced at the schema · not by process discipline<\u002Fspan>\n          <\u002Fdiv>\n\n          <div class=\"s8-rules-grid\">\n            <div class=\"s8-rule\">\n              <div class=\"rule-num\">01<\u002Fdiv>\n              <div class=\"rule-title\">One case per issue<\u002Fdiv>\n              <div class=\"rule-body\">No duplicates ever. <strong>Open-case detection<\u002Fstrong> at routing — if a case exists for this issue, append don't create.<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"s8-rule\">\n              <div class=\"rule-num\">02<\u002Fdiv>\n              <div class=\"rule-title\">Case owner never empty<\u002Fdiv>\n              <div class=\"rule-body\"><strong>AI agent<\u002Fstrong> during AI resolution. <strong>Human<\u002Fstrong> after escalation. The owner field cannot be null at any moment in the lifecycle.<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"s8-rule\">\n              <div class=\"rule-num\">03<\u002Fdiv>\n              <div class=\"rule-title\">Entitlement frozen at creation<\u002Fdiv>\n              <div class=\"rule-body\">Snapshotted at case creation. <strong>No SLA bait-and-switch<\u002Fstrong> in either direction — tier upgrade or downgrade mid-case doesn't change service.<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"s8-rule\">\n              <div class=\"rule-num\">04<\u002Fdiv>\n              <div class=\"rule-title\">Context travels with case<\u002Fdiv>\n              <div class=\"rule-body\">Resolution timeline, AI log, prior interactions all attached to the case. <strong>Never lost on handoff.<\u002Fstrong><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"s8-rule\">\n              <div class=\"rule-num\">05<\u002Fdiv>\n              <div class=\"rule-title\">Customer confirms closure<\u002Fdiv>\n              <div class=\"rule-body\">Expert close → <em>Pending Customer Confirmation<\u002Fem>. <strong>Only the customer<\u002Fstrong> can move state to Resolved.<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"s8-rule\">\n              <div class=\"rule-num\">06<\u002Fdiv>\n              <div class=\"rule-title\">Immutable after closure<\u002Fdiv>\n              <div class=\"rule-body\">Audit trail finalized. <strong>Reopens preserve case ID<\u002Fstrong> — never a new case for the same root issue.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <div class=\"s8-take\">\n        <div class=\"label-tag\">The point<\u002Fdiv>\n        <div class=\"body-text\">Single-threaded ownership is enforced by <strong>the data model<\u002Fstrong> — not by process discipline. The system makes it <em>impossible<\u002Fem> to lose a case, duplicate a case, or close a case without the customer.<\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n  <\u002Fsection>\n\n  <!-- ============================================================\n       SLIDE 10 — THREE-YEAR ROADMAP\n       ============================================================ -->\n  <section data-label=\"08 Three-Year Roadmap\" class=\"s10\" data-om-validate=\"\">\n\n    <div class=\"s10-bar\" aria-hidden=\"true\"><\u002Fdiv>\n\n    <div class=\"s10-frame\">\n\n      <!-- HEADER -->\n      <div>\n        <div class=\"s10-eyebrow\">\n          <span class=\"s10-num\">008<\u002Fspan>\n          <span class=\"s10-divider\"><\u002Fspan>\n          <span class=\"s10-section\">ROADMAP &amp; SEQUENCING<\u002Fspan>\n        <\u002Fdiv>\n        <h1 class=\"s10-title\">Three-year <span class=\"accent\">roadmap<\u002Fspan><\u002Fh1>\n        <p class=\"s10-subtitle\"><strong>Foundation in Year 1<\u002Fstrong> · AI autonomy gradual in Year 2 · <strong>Self-improving in Year 3.<\u002Fstrong> The architecture stays. The timing flexes.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- SECTION 1 — PRINCIPLES -->\n      <div class=\"s10-principles\">\n        <div class=\"s10-pri\">\n          <div class=\"num\">01<\u002Fdiv>\n          <div class=\"body\">\n            <div class=\"head\">Bridge what exists<\u002Fdiv>\n            <div class=\"desc\">Product agents work. VEP works. Intuit Assist works. <strong>Connect — don't rebuild.<\u002Fstrong><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"s10-pri\">\n          <div class=\"num\">02<\u002Fdiv>\n          <div class=\"body\">\n            <div class=\"head\">AI assist universal Day 1, autonomy gradual<\u002Fdiv>\n            <div class=\"desc\">Expert AI assist launches Year 1. <strong>Autonomous resolution starts Year 2<\u002Fstrong> with low-risk cohorts.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"s10-pri\">\n          <div class=\"num\">03<\u002Fdiv>\n          <div class=\"body\">\n            <div class=\"head\">Foundation before intelligence<\u002Fdiv>\n            <div class=\"desc\">Year 1 foundation. Year 2 AI resolution. <strong>Year 3 self-improving.<\u002Fstrong><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"s10-pri\">\n          <div class=\"num\">04<\u002Fdiv>\n          <div class=\"body\">\n            <div class=\"head\">Discovery shapes timing<\u002Fdiv>\n            <div class=\"desc\">What exists today determines build vs integrate. <strong>Q1 discovery validates state.<\u002Fstrong><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- SECTION 2 — TIMELINE -->\n      <div class=\"s10-timeline\">\n\n        <!-- YEAR 1 -->\n        <div class=\"s10-year s10-year--y1\">\n          <div class=\"s10-year-head\">\n            <div class=\"yearline\">\n              <div class=\"label\">YEAR 01 · FOUNDATION<\u002Fdiv>\n              <div class=\"name\">Foundation<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"sub\">AI assist universal.<br>No autonomous resolution yet.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s10-q\">\n            <div class=\"qhead\"><span class=\"qid\">Q1<\u002Fspan><span class=\"qtitle\">Discovery + Architecture<\u002Fspan><\u002Fdiv>\n            <div class=\"qbody\"><strong>Customer identity stitching<\u002Fstrong> across GBSG products — the critical Year 1 dependency. CRM platform decision. AI agent integration boundary mapped. <strong>No build — discovery only.<\u002Fstrong><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s10-q s10-q-alt\">\n            <div class=\"qhead\"><span class=\"qid\">Q2<\u002Fspan><span class=\"qtitle\">Foundation Build<\u002Fspan><\u002Fdiv>\n            <div class=\"qbody\">CRM platform setup. <strong>Unified case data model deployed.<\u002Fstrong> Normalization layer build begins (Identity Resolver first). Single-threaded ownership at the data layer.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s10-q\">\n            <div class=\"qhead\"><span class=\"qid\">Q3<\u002Fspan><span class=\"qtitle\">Channel Integration + Routing<\u002Fspan><\u002Fdiv>\n            <div class=\"qbody\">Normalization completes. <strong>Override Rules Engine + Routing engine.<\u002Fstrong> Channels — Web · Email · Live chat · Phone · IVR. Bridge from Intuit Assist into case management.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s10-q s10-q-alt\">\n            <div class=\"qhead\"><span class=\"qid\">Q4<\u002Fspan><span class=\"qtitle\">Bridge + AI Assist + Pilot<\u002Fspan><\u002Fdiv>\n            <div class=\"qbody\">L4 Product Agent detections route to case mgmt — Flow 1 live. <strong>GenSRF integration first active.<\u002Fstrong> AI assist in pilot — KB + suggested action. Notifications production. Pilot one sub-segment.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s10-year-foot\">No autonomous Resolution Agent yet<\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- YEAR 2 -->\n        <div class=\"s10-year s10-year--y2\">\n          <div class=\"s10-year-head\">\n            <div class=\"yearline\">\n              <div class=\"label\">YEAR 02 · AUTONOMY BEGINS<\u002Fdiv>\n              <div class=\"name\">AI autonomy<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"sub\">Low-risk cohorts only.<br>GenSRF gates everything.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s10-q\">\n            <div class=\"qhead\"><span class=\"qid\">Q5<\u002Fspan><span class=\"qtitle\">Resolution Agent Build<\u002Fspan><\u002Fdiv>\n            <div class=\"qbody\">Architecture + model selection. <strong>Training data — existing Intuit cases cleaned + labeled<\u002Fstrong>, plus Year 1 pilot data. GenSRF extended to Resolution Agent. Confidence calibration.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s10-q s10-q-alt\">\n            <div class=\"qhead\"><span class=\"qid\">Q6<\u002Fspan><span class=\"qtitle\">Limited Launch<\u002Fspan><\u002Fdiv>\n            <div class=\"qbody\">QBO Plus / Essentials / Solopreneur navigation. Payroll Core / Premium setup. Payments explanation only. Mailchimp queries. <strong>Low-risk single-domain only.<\u002Fstrong><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s10-q\">\n            <div class=\"qhead\"><span class=\"qid\">Q7<\u002Fspan><span class=\"qtitle\">Expand Scope<\u002Fspan><\u002Fdiv>\n            <div class=\"qbody\">Add QBO Advanced. Multi-domain cases (QBO + Payroll). capture resolution paths.&nbsp;&nbsp;Increase confidence threshold incrementally.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s10-q s10-q-alt\">\n            <div class=\"qhead\"><span class=\"qid\">Q8<\u002Fspan><span class=\"qtitle\">Pattern Detection Groundwork<\u002Fspan><\u002Fdiv>\n            <div class=\"qbody\">Historical case pattern analysis. Anomaly detection model training. Predictive feature engineering. <strong>Foundation for Year 3.<\u002Fstrong><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s10-year-foot\">Resolution Agent live · low-risk only<\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- YEAR 3 -->\n        <div class=\"s10-year s10-year--y3\">\n          <div class=\"s10-year-head\">\n            <div class=\"yearline\">\n              <div class=\"label\">YEAR 03 · SELF-IMPROVING<\u002Fdiv>\n              <div class=\"name\">Predictive at scale<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"sub\">The flywheel turns.<br>Higher-risk cohorts — carefully.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s10-q\">\n            <div class=\"qhead\"><span class=\"qid\">Q9<\u002Fspan><span class=\"qtitle\">AI Learning Engine in Production<\u002Fspan><\u002Fdiv>\n            <div class=\"qbody\"><strong>Full closed-loop learning.<\u002Fstrong> Routing weights update from outcomes. KB drafts auto-generated. Expert performance feeds routing. Anomaly thresholds self-tune.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s10-q s10-q-alt\">\n            <div class=\"qhead\"><span class=\"qid\">Q10<\u002Fspan><span class=\"qtitle\">Predictive at Scale<\u002Fspan><\u002Fdiv>\n            <div class=\"qbody\">Pattern detection from Q8 goes live. <strong>Proactive intervention before customer notices.<\u002Fstrong> Predictive routing matches expert by predicted resolution success.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s10-q\">\n            <div class=\"qhead\"><span class=\"qid\">Q11<\u002Fspan><span class=\"qtitle\">Higher-Risk Cohorts (Carefully)<\u002Fspan><\u002Fdiv>\n            <div class=\"qbody\">IES medium-risk reporting. Payroll Elite setup-only. Live Full-Service AI assists bookkeeper (not replaced). <strong>AI prepares tax filing context (does not file).<\u002Fstrong><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s10-q s10-q-alt\">\n            <div class=\"qhead\"><span class=\"qid\">Q12<\u002Fspan><span class=\"qtitle\">Optimize + Expand<\u002Fspan><\u002Fdiv>\n            <div class=\"qbody\">System refinement based on Year 3 metrics. Cohort expansion within risk-accepted scope. Continuous learning. <strong>Year 3 routing measurably better than Year 1.<\u002Fstrong><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s10-year-foot\">Self-improving · predictive · expanding<\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <!-- SECTION 3 — COHORT SEQUENCING -->\n      <div class=\"s10-cohort\">\n        <div class=\"s10-cohort-head\">\n          <div class=\"s10-cohort-tag\">Cohort sequencing — when each capability turns on<\u002Fdiv>\n          <div class=\"s10-cohort-meta\">Bars align with the year columns above — Y1 / Y2 / Y3<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"s10-cohort-row\">\n          <div class=\"row-meta\">\n            <div class=\"lbl\"><span class=\"micro\">Row 01<\u002Fspan>AI Assist + Proactive Detection<\u002Fdiv>\n            <div class=\"ticks\"><span>Y1<\u002Fspan><span>Y2<\u002Fspan><span>Y3<\u002Fspan><\u002Fdiv>\n            <div class=\"desc\">All tiers — Year 1 (incl. <strong>IES, Live Full-Service, Priority Circle<\u002Fstrong>)<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s10-cohort-bar\">\n            <div class=\"seg\"><\u002Fdiv><div class=\"seg\"><\u002Fdiv><div class=\"seg\"><\u002Fdiv>\n            <div class=\"fill assist\">ALL TIERS · YEAR 1 →<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"s10-cohort-row\">\n          <div class=\"row-meta\">\n            <div class=\"lbl\"><span class=\"micro\">Row 02<\u002Fspan>AI Autonomous Resolution<\u002Fdiv>\n            <div class=\"ticks\"><span>Y1<\u002Fspan><span>Y2<\u002Fspan><span>Y3<\u002Fspan><\u002Fdiv>\n            <div class=\"desc\"><strong>Year 2 — low-risk cohorts only.<\u002Fstrong> Year 3 expands carefully.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s10-cohort-bar\">\n            <div class=\"seg\"><\u002Fdiv><div class=\"seg\"><\u002Fdiv><div class=\"seg\"><\u002Fdiv>\n            <div class=\"fill auto-y2\">YEAR 2 · LOW-RISK<\u002Fdiv>\n            <div class=\"fill auto-y3\">YEAR 3 · CAREFUL EXPANSION<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"s10-cohort-row\">\n          <div class=\"row-meta\">\n            <div class=\"lbl\"><span class=\"micro\">Row 03<\u002Fspan>Predictive Intervention<\u002Fdiv>\n            <div class=\"ticks\"><span>Y1<\u002Fspan><span>Y2<\u002Fspan><span>Y3<\u002Fspan><\u002Fdiv>\n            <div class=\"desc\"><strong>Year 3<\u002Fstrong> — pattern detection at scale.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s10-cohort-bar\">\n            <div class=\"seg\"><\u002Fdiv><div class=\"seg\"><\u002Fdiv><div class=\"seg\"><\u002Fdiv>\n            <div class=\"fill predict\">YEAR 3 · PATTERN DETECTION<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- SECTION 4 — PERMANENT EXCLUSIONS -->\n      <div class=\"s10-exclusions\">\n        <div class=\"s10-exc-head\">\n          <div class=\"s10-exc-tag\">WHAT STAYS HUMAN — <em style=\"font-style:normal;\">FOREVER<\u002Fem><\u002Fdiv>\n          <div class=\"s10-exc-title\">Some cases require <em>human judgment<\u002Fem> AI cannot defend.<\u002Fdiv>\n          <div class=\"s10-exc-foot\"><strong>By design<\u002Fstrong> · not by limitation.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"s10-exc-list\">\n          <div class=\"s10-exc-item\">IRS interactions<\u002Fdiv>\n          <div class=\"s10-exc-item\">Multi-entity consolidation<\u002Fdiv>\n          <div class=\"s10-exc-item\">Security breaches<\u002Fdiv>\n          <div class=\"s10-exc-item\">High-value payments above threshold<\u002Fdiv>\n          <div class=\"s10-exc-item\">Worker classification decisions<\u002Fdiv>\n          <div class=\"s10-exc-item\">Customer's books in Live Full-Service<\u002Fdiv>\n          <div class=\"s10-exc-item\">Payroll Elite tax filings<\u002Fdiv>\n          <div class=\"s10-exc-item\">Regulated tax filings end-to-end<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- SECTION 5 — BOTTOM CALLOUT -->\n      <div class=\"s10-callout\">\n        <span class=\"s10-callout-label\">BOTTOM LINE<\u002Fspan>\n        <span class=\"s10-callout-body\"><strong>Trust earns scope.<\u002Fstrong> AI autonomy expands as the system proves itself. Some cases stay human forever — <em>by design, not by limitation.<\u002Fem><\u002Fspan>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n  <\u002Fsection>\n\n  <!-- ============================================================\n       SLIDE 11 — DRIVING ALIGNMENT ACROSS BUSINESS UNITS\n       ============================================================ -->\n  <section data-label=\"09 Driving Alignment\" class=\"s11\" data-om-validate=\"\">\n\n    <div class=\"s11-bar\" aria-hidden=\"true\"><\u002Fdiv>\n\n    <div class=\"s11-frame\">\n\n      <!-- HEADER -->\n      <div>\n        <div class=\"s11-eyebrow\">\n          <span class=\"s11-num\">009<\u002Fspan>\n          <span class=\"s11-divider\"><\u002Fspan>\n          <span class=\"s11-section\">MATRIX ALIGNMENT<\u002Fspan>\n        <\u002Fdiv>\n        <h1 class=\"s11-title\">Driving alignment <span class=\"accent\">across business units<\u002Fspan><\u002Fh1>\n        <p class=\"s11-subtitle\">How shared data models and standardized workflows actually get built — <strong>woven through the roadmap, not bolted on.<\u002Fstrong><\u002Fp>\n      <\u002Fdiv>\n\n      <!-- SECTION 1 — SIX STEPS -->\n      <div class=\"s11-steps-wrap\">\n        <div class=\"s11-steps-head\">\n          <span class=\"label\">Six steps that drive alignment — sequenced through the roadmap<\u002Fspan>\n          <span class=\"rule\"><\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"s11-steps\">\n          <div class=\"s11-step\">\n            <div class=\"step-head\">\n              <span class=\"step-num\">STEP 01<\u002Fspan>\n              <span class=\"step-q\">Q1<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"step-title\">Find the shared pain<\u002Fdiv>\n            <div class=\"step-do\"><span class=\"micro\">What you do<\u002Fspan>Bring data on case duplication, repeat contacts, SLA breaches across all three sub-segments. Let the numbers establish shared pain.<\u002Fdiv>\n            <div class=\"step-why\"><span class=\"micro\">Why it works<\u002Fspan>Data is harder to dispute than narrative. All three sub-segments see the same problems.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s11-step\">\n            <div class=\"step-head\">\n              <span class=\"step-num\">STEP 02<\u002Fspan>\n              <span class=\"step-q\">Q1–Q2<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"step-title\">Co-design the data model<\u002Fdiv>\n            <div class=\"step-do\"><span class=\"micro\">What you do<\u002Fspan>Working sessions with sub-segment representatives. Identify shared schema vs sub-segment configuration. Build the Case object together.<\u002Fdiv>\n            <div class=\"step-why\"><span class=\"micro\">Why it works<\u002Fspan>Sub-segments have ownership of decisions they participated in. Adoption later is using what we agreed on.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s11-step\">\n            <div class=\"step-head\">\n              <span class=\"step-num\">STEP 03<\u002Fspan>\n              <span class=\"step-q\">Q4<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"step-title\">Pilot where data points first<\u002Fdiv>\n            <div class=\"step-do\"><span class=\"micro\">What you do<\u002Fspan>SMB Mid-Market pilots first. Highest volume, lowest blast radius, most standardized workflows, least operational lock-in.<\u002Fdiv>\n            <div class=\"step-why\"><span class=\"micro\">Why it works<\u002Fspan>Five criteria converge on the same cohort. Evidence accumulates fastest where cases repeat at scale.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s11-step\">\n            <div class=\"step-head\">\n              <span class=\"step-num\">STEP 04<\u002Fspan>\n              <span class=\"step-q\">Q5–Q7<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"step-title\">Address each specific objection<\u002Fdiv>\n            <div class=\"step-do\"><span class=\"micro\">What you do<\u002Fspan>Specific architectural answers, not corporate platitudes.<\u002Fdiv>\n            <div class=\"step-why\"><span class=\"micro\">Why it works<\u002Fspan>Each sub-segment hears their concern addressed concretely.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s11-step\">\n            <div class=\"step-head\">\n              <span class=\"step-num\">STEP 05<\u002Fspan>\n              <span class=\"step-q\">THROUGHOUT<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"step-title\">Lightweight governance<\u002Fdiv>\n            <div class=\"step-do\"><span class=\"micro\">What you do<\u002Fspan>Architecture Working Group, biweekly during build. One architecture lead per sub-segment plus central architecture. Schema decisions logged with rationale. No standing committees beyond this.<\u002Fdiv>\n            <div class=\"step-why\"><span class=\"micro\">Why it works<\u002Fspan>One body, one cadence, one decision log. Decisions get made and stay made.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s11-step\">\n            <div class=\"step-head\">\n              <span class=\"step-num\">STEP 06<\u002Fspan>\n              <span class=\"step-q\">Q7–Q11<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"step-title\">Earn expansion through evidence<\u002Fdiv>\n            <div class=\"step-do\"><span class=\"micro\">What you do<\u002Fspan>Mid-Market adoption begins Q7, completes through Q8-Q9 as accounts migrate. Services adoption begins Q11 within exclusion boundaries.<\u002Fdiv>\n            <div class=\"step-why\"><span class=\"micro\">Why it works<\u002Fspan>Evidence-based expansion is gradual, not binary. Each account migrates when their specific situation supports it.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- SECTION 3 — STEP 4 ELABORATION -->\n      <div class=\"s11-step4\">\n        <div class=\"s11-step4-head\">\n          <span class=\"pin\">STEP 04<\u002Fspan>\n          <span class=\"ttl\">Primary objection-answer pairs<\u002Fspan>\n          <span class=\"sub\">Each sub-segment has multiple concerns. The architectural answer addresses the primary one. Operational concerns work in parallel.<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"s11-step4-rows\">\n          <div class=\"s11-pair\">\n            <div class=\"who\">Mid-Market<\u002Fdiv>\n            <div class=\"obj\">\"Will the shared model make our high-touch customers feel like generic tickets?\"<\u002Fdiv>\n            <div class=\"ans\"><span><strong>Case Owner field<\u002Fstrong> preserves the account manager. Customer relationship history travels with the case.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s11-pair\">\n            <div class=\"who\">Services<\u002Fdiv>\n            <div class=\"obj\">\"AI will replace our bookkeepers.\"<\u002Fdiv>\n            <div class=\"ans\"><span><strong>Exclusion list<\u002Fstrong> + AI assists, not replaces. Customer books in Live Full-Service stays human forever.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s11-pair\">\n            <div class=\"who\">SMB Mid-Market<\u002Fdiv>\n            <div class=\"obj\">\"Mid-Market and Services are too slow.\"<\u002Fdiv>\n            <div class=\"ans\"><span>Pilot first. Evidence second. Expansion third.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- SECTION 4 — BOTTOM CALLOUT -->\n      <div class=\"s11-callout\">\n        <span class=\"s11-callout-label\">BOTTOM LINE<\u002Fspan>\n        <span class=\"s11-callout-body\">Alignment is <em>woven through the roadmap<\u002Fem>, not bolted on. <strong>Each sub-segment adopts when the evidence answers their specific concern.<\u002Fstrong><\u002Fspan>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n  <\u002Fsection>\n\n  <!-- ============================================================\n       SLIDE 12 — MEASURING SUCCESS\n       ============================================================ -->\n  <section data-label=\"10 Measuring Success\" class=\"s12\" data-om-validate=\"\">\n\n    <div class=\"s12-bar\" aria-hidden=\"true\"><\u002Fdiv>\n\n    <div class=\"s12-frame\">\n\n      <!-- HEADER -->\n      <div>\n        <div class=\"s12-eyebrow\">\n          <span class=\"s12-num\">010<\u002Fspan>\n          <span class=\"s12-divider\"><\u002Fspan>\n          <span class=\"s12-section\">MEASURING SUCCESS<\u002Fspan>\n        <\u002Fdiv>\n        <h1 class=\"s12-title\">Measuring success — <span class=\"accent\">what proves the architecture is working<\u002Fspan><\u002Fh1>\n        <p class=\"s12-subtitle\"><strong>Four categories.<\u002Fstrong> Year-by-year goals. <strong>Three metrics that tell the truth.<\u002Fstrong> Three anti-metrics to avoid.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- SECTION 1 — FOUR CATEGORIES -->\n      <div>\n        <div class=\"s12-seclabel\"><span class=\"text\">01 · Four categories of metrics<\u002Fspan><span class=\"rule\"><\u002Fspan><\u002Fdiv>\n        <div class=\"s12-cats\">\n          <div class=\"s12-cat\">\n            <span class=\"cat-tag\">CATEGORY 01<\u002Fspan>\n            <div class=\"cat-name\">Customer Outcome<\u002Fdiv>\n            <div class=\"cat-q\">Did the customer get a good experience?<\u002Fdiv>\n            <ul class=\"cat-list\">\n              <li><span class=\"arrow up\">↑<\u002Fspan>First Contact Resolution Rate<\u002Fli>\n              <li><span class=\"arrow down\">↓<\u002Fspan>Repeat Contact Rate<\u002Fli>\n              <li><span class=\"arrow down\">↓<\u002Fspan>Time to Resolution<\u002Fli>\n              <li><span class=\"arrow up\">↑<\u002Fspan>CSAT and NPS<\u002Fli>\n              <li><span class=\"arrow down\">↓<\u002Fspan>Customer Effort Score<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n          <div class=\"s12-cat\">\n            <span class=\"cat-tag\">CATEGORY 02<\u002Fspan>\n            <div class=\"cat-name\">Operational<\u002Fdiv>\n            <div class=\"cat-q\">Is the system running efficiently?<\u002Fdiv>\n            <ul class=\"cat-list\">\n              <li><span class=\"arrow up\">↑<\u002Fspan>SLA Adherence Rate<\u002Fli>\n              <li><span class=\"arrow down\">↓<\u002Fspan>Number of Handoffs Per Case<\u002Fli>\n              <li><span class=\"arrow down\">↓<\u002Fspan>Queue Wait Time<\u002Fli>\n              <li><span class=\"arrow down\">↓<\u002Fspan>Reopen Rate<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n          <div class=\"s12-cat\">\n            <span class=\"cat-tag\">CATEGORY 03<\u002Fspan>\n            <div class=\"cat-name\">AI Quality<\u002Fdiv>\n            <div class=\"cat-q\">Is AI helping or causing problems?<\u002Fdiv>\n            <ul class=\"cat-list\">\n              <li><span class=\"arrow up\">↑<\u002Fspan>AI Resolution Success Rate<\u002Fli>\n              <li><span class=\"arrow down\">↓<\u002Fspan>AI Resolution Reversal Rate <em style=\"font-style:italic;color:#C44545;font-weight:600;\">· critical<\u002Fem><\u002Fli>\n              <li><span class=\"arrow up\">↑<\u002Fspan>AI Escalation Quality<\u002Fli>\n              <li><span class=\"arrow up\">↑<\u002Fspan>Expert Feedback on AI<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n          <div class=\"s12-cat\">\n            <span class=\"cat-tag\">CATEGORY 04<\u002Fspan>\n            <div class=\"cat-name\">System Health <span style=\"font-weight:400;color:var(--ink-dim);font-size:10.5px;\">· technical<\u002Fspan><\u002Fdiv>\n            <div class=\"cat-q\">Is the architecture itself sound?<\u002Fdiv>\n            <ul class=\"cat-list\">\n              <li><span class=\"arrow abs\">99.9%+<\u002Fspan>Bridge Availability <em style=\"font-style:italic;color:var(--ink-dim);font-weight:400;\">· uptime<\u002Fem><\u002Fli>\n              <li><span class=\"arrow abs\">100%<\u002Fspan>GenSRF Audit Trail Completeness<\u002Fli>\n              <li><span class=\"arrow abs\">100%<\u002Fspan>Case Data Model Integrity<\u002Fli>\n              <li><span class=\"arrow up\">↑<\u002Fspan>Notification Delivery Success<\u002Fli>\n              <li><span class=\"arrow down\">↓<\u002Fspan>Routing Engine Latency<\u002Fli>\n              <li><span class=\"arrow up\">↑<\u002Fspan>Open Case Detection Accuracy<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- SECTION 2 — YEAR-BY-YEAR -->\n      <div>\n        <div class=\"s12-seclabel\"><span class=\"text\">02 · Year-by-year success view<\u002Fspan><span class=\"rule\"><\u002Fspan><\u002Fdiv>\n        <div class=\"s12-years\">\n          <div class=\"s12-year s12-year--y1\">\n            <div class=\"s12-year-head\">\n              <span class=\"label\">YEAR 01 · FOUNDATION SUCCESS<\u002Fspan>\n              <h3 class=\"name\">Bridge in production<\u002Fh3>\n              <div class=\"what\">Pilot scope running. Customers no longer re-explain.<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"s12-year-body\">\n              <div class=\"body-tag\">Key metrics<\u002Fdiv>\n              <ul>\n                <li><span class=\"arrow\">↓<\u002Fspan>Repeat contact rate in pilot — <strong>measurably below baseline<\u002Fstrong><\u002Fli>\n                <li><span class=\"arrow\">↓<\u002Fspan>Customer-initiated status inquiries — <strong>measurably below baseline<\u002Fstrong><\u002Fli>\n                <li><span class=\"arrow\">↑<\u002Fspan>SLA adherence — measurably above baseline<\u002Fli>\n                <li><span class=\"arrow\">0<\u002Fspan>Duplicate cases for same customer/issue<\u002Fli>\n                <li><span class=\"arrow\">100%<\u002Fspan>Context continuity across handoffs<\u002Fli>\n              <\u002Ful>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s12-year s12-year--y2\">\n            <div class=\"s12-year-head\">\n              <span class=\"label\">YEAR 02 · AI AUTONOMY EARNED<\u002Fspan>\n              <h3 class=\"name\">Resolution Agent live<\u002Fh3>\n              <div class=\"what\">Low-risk cohorts. Mid-Market adopted. Customer trust maintained.<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"s12-year-body\">\n              <div class=\"body-tag\">Key metrics<\u002Fdiv>\n              <ul>\n                <li><span class=\"arrow\">↑<\u002Fspan>AI resolution success rate <strong>in approved scope<\u002Fstrong> — meets target<\u002Fli>\n                <li><span class=\"arrow\">↓<\u002Fspan>AI resolution reversal rate — below threshold<\u002Fli>\n                <li><span class=\"arrow\">≈<\u002Fspan>CSAT for AI-resolved — comparable to or better than human-resolved<\u002Fli>\n                <li><span class=\"arrow\">✓<\u002Fspan>Mid-Market adoption complete — named relationships preserved<\u002Fli>\n                <li><span class=\"arrow\">↑<\u002Fspan>Cross-product cases successfully handled<\u002Fli>\n              <\u002Ful>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"s12-year s12-year--y3\">\n            <div class=\"s12-year-head\">\n              <span class=\"label\">YEAR 03 · SELF-IMPROVING AT SCALE<\u002Fspan>\n              <h3 class=\"name\">Predictive intervention<\u002Fh3>\n              <div class=\"what\">AI Learning Engine live. Services adopted.<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"s12-year-body\">\n              <div class=\"body-tag\">Key metrics<\u002Fdiv>\n              <ul>\n                <li><span class=\"arrow\">↑<\u002Fspan>Y3 routing accuracy <strong>measurably better than Y1<\u002Fstrong><\u002Fli>\n                <li><span class=\"arrow\">↑<\u002Fspan>Y3 FCR measurably higher than Y1<\u002Fli>\n                <li><span class=\"arrow\">↓<\u002Fspan>Y3 repeat contact rate measurably lower than Y1<\u002Fli>\n                <li><span class=\"arrow\">↑<\u002Fspan>Proactive intervention rate — significant<\u002Fli>\n                <li><span class=\"arrow\">✓<\u002Fspan>Services adoption — bookkeeper relationships preserved<\u002Fli>\n                <li><span class=\"arrow\">✓<\u002Fspan>Permanent exclusions still honored<\u002Fli>\n              <\u002Ful>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- SECTION 3 — TRUTH METRICS + ANTI-METRICS -->\n      <div class=\"s12-truth-row\">\n        <div class=\"s12-truth\">\n          <div class=\"s12-bblock-head\">\n            <span class=\"ttl\">Three metrics that tell the truth<\u002Fspan>\n            <span class=\"sub\">If you only watched these three, you would know if the architecture is working.<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"s12-bblock-list\">\n            <div class=\"s12-tr-item\">\n              <span class=\"badge\">01<\u002Fspan>\n              <div class=\"body\">\n                <div class=\"row1\"><span class=\"name\">Customer-Initiated Status Inquiries<\u002Fspan><span class=\"dir zero\">Target · near zero by Year 3<\u002Fspan><\u002Fdiv>\n                <div class=\"desc\">Measures whether <strong>single-threaded ownership is real.<\u002Fstrong> If customers ask \"what's happening with my case,\" Intuit is not owning follow-up.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"s12-tr-item\">\n              <span class=\"badge\">02<\u002Fspan>\n              <div class=\"body\">\n                <div class=\"row1\"><span class=\"name\">Repeat Contact Rate<\u002Fspan><span class=\"dir down\">Direction · ↓<\u002Fspan><\u002Fdiv>\n                <div class=\"desc\">Measures whether <strong>resolution actually resolved.<\u002Fstrong> Closure does not mean resolved. If customers come back, the architecture is hiding the problem.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"s12-tr-item\">\n              <span class=\"badge\">03<\u002Fspan>\n              <div class=\"body\">\n                <div class=\"row1\"><span class=\"name\">AI Resolution Reversal Rate<\u002Fspan><span class=\"dir crit\">↓ · critical<\u002Fspan><\u002Fdiv>\n                <div class=\"desc\">Measures whether <strong>AI is earning customer trust.<\u002Fstrong> Rising reversal is the early warning to pull back AI scope.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"s12-anti\">\n          <div class=\"s12-bblock-head\">\n            <span class=\"ttl\">Three anti-metrics — what NOT to optimize for<\u002Fspan>\n            <span class=\"sub\">These look like success but quietly destroy the system.<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"s12-bblock-list\">\n            <div class=\"s12-an-item\">\n              <span class=\"badge\">✕<\u002Fspan>\n              <div class=\"body\">\n                <div class=\"row1\"><span class=\"name\">AI Deflection Rate as primary metric<\u002Fspan><\u002Fdiv>\n                <div class=\"desc\">Creates pressure to push AI to handle cases it should not. <strong>Optimize for resolution quality, not deflection volume.<\u002Fstrong><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"s12-an-item\">\n              <span class=\"badge\">✕<\u002Fspan>\n              <div class=\"body\">\n                <div class=\"row1\"><span class=\"name\">Average Handle Time alone<\u002Fspan><\u002Fdiv>\n                <div class=\"desc\">Pressuring experts to close faster trades quality for speed. <strong>Track AHT but pressure on FCR and CSAT instead.<\u002Fstrong><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"s12-an-item\">\n              <span class=\"badge\">✕<\u002Fspan>\n              <div class=\"body\">\n                <div class=\"row1\"><span class=\"name\">Customer Self-Serve Rate as primary metric<\u002Fspan><\u002Fdiv>\n                <div class=\"desc\">Looks good but may mean customers <strong>failed to reach a human.<\u002Fstrong> Self-serve emerges from making humans available, not from blocking access.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- SECTION 4 — BOTTOM CALLOUT -->\n      <div class=\"s12-callout\">\n        <span class=\"s12-callout-label\">BOTTOM LINE<\u002Fspan>\n        <span class=\"s12-callout-body\">Success is <strong>not<\u002Fstrong> measured by how many cases AI resolved. Success is measured by whether customers got resolution <em>without effort<\u002Fem>, whether single-threaded ownership held, and whether AI <em>earned customer trust<\u002Fem>.<\u002Fspan>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n  <\u002Fsection>\n\n  <!-- ============================================================\n       SLIDE 13 — THE DEFENSIBLE POSITION (CLOSING)\n       ============================================================ -->\n  <section data-label=\"11 The Defensible Position\" class=\"s13\" data-om-validate=\"\">\n\n    <div class=\"s13-bar\" aria-hidden=\"true\"><\u002Fdiv>\n\n    <div class=\"s13-frame s13-frame--solo\">\n\n      <!-- HEADER -->\n      <div>\n        <div class=\"s13-eyebrow\">\n          <span class=\"s13-num\">011<\u002Fspan>\n          <span class=\"s13-divider\"><\u002Fspan>\n          <span class=\"s13-section\">CLOSING<\u002Fspan>\n        <\u002Fdiv>\n        <h1 class=\"s13-title\">Closing <span class=\"accent\">comments<\u002Fspan><\u002Fh1>\n      <\u002Fdiv>\n\n      <!-- BOTTOM CALLOUT -->\n      <div class=\"s13-solo-center\">\n        <div class=\"s13-callout\">\n          <span class=\"s13-callout-label\">BOTTOM<br>LINE<\u002Fspan>\n          <span class=\"s13-callout-body\">This is not a roadmap to deploy AI everywhere. This is a roadmap to <em>earn customer trust<\u002Fem> through architecture that respects <em>what AI can defend<\u002Fem> and <em>what humans must own<\u002Fem>. <strong>The architecture stays. The timing flexes. The customer never re-explains. The customer never follows up.<\u002Fstrong><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n  <\u002Fsection>\n\n<\u002Fdeck-stage>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
